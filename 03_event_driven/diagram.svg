<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="660" viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/></linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f85149"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3fb950"/></marker>
  </defs>
  <rect width="960" height="660" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Event-Driven Architecture (EDA)</text>
  <text x="480" y="57" text-anchor="middle" fill="#8b949e" font-size="13">Producers emit events · Broker fans out · Consumers react independently</text>

  <!-- Producers -->
  <text x="80" y="100" text-anchor="middle" fill="#388bfd" font-size="13" font-weight="bold">PRODUCERS</text>
  <rect x="20" y="110" width="170" height="60" rx="8" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="105" y="136" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Order Service</text>
  <text x="105" y="155" text-anchor="middle" fill="#7ab8ff" font-size="11">PlaceOrderUseCase</text>

  <rect x="20" y="185" width="170" height="60" rx="8" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="105" y="211" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Payment Service</text>
  <text x="105" y="230" text-anchor="middle" fill="#7ab8ff" font-size="11">ChargeCardUseCase</text>

  <rect x="20" y="260" width="170" height="60" rx="8" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="105" y="286" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">User Service</text>
  <text x="105" y="305" text-anchor="middle" fill="#7ab8ff" font-size="11">RegisterUserUseCase</text>

  <!-- Arrows to broker -->
  <line x1="190" y1="140" x2="330" y2="220" stroke="#f85149" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="190" y1="215" x2="330" y2="248" stroke="#f85149" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="190" y1="290" x2="330" y2="278" stroke="#f85149" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Event labels on arrows -->
  <text x="252" y="173" fill="#ff7b72" font-size="10" transform="rotate(-20,252,173)">OrderPlaced</text>
  <text x="255" y="230" fill="#ff7b72" font-size="10">PaymentCharged</text>
  <text x="250" y="290" fill="#ff7b72" font-size="10" transform="rotate(15,250,290)">UserRegistered</text>

  <!-- Message Broker (center) -->
  <rect x="330" y="160" width="300" height="220" rx="12" fill="#1a0808" stroke="#f85149" stroke-width="3"/>
  <text x="480" y="187" text-anchor="middle" fill="#f85149" font-size="15" font-weight="bold">Message Broker</text>
  <text x="480" y="207" text-anchor="middle" fill="#ff7b72" font-size="12">Kafka / RabbitMQ / AWS SNS</text>
  <rect x="350" y="218" width="260" height="28" rx="5" fill="#ff6b6b22" stroke="#ff6b6b" stroke-width="1"/>
  <text x="480" y="237" text-anchor="middle" fill="#ff9090" font-size="11">Topic: order.placed</text>
  <rect x="350" y="254" width="260" height="28" rx="5" fill="#ff6b6b22" stroke="#ff6b6b" stroke-width="1"/>
  <text x="480" y="273" text-anchor="middle" fill="#ff9090" font-size="11">Topic: payment.charged</text>
  <rect x="350" y="290" width="260" height="28" rx="5" fill="#ff6b6b22" stroke="#ff6b6b" stroke-width="1"/>
  <text x="480" y="309" text-anchor="middle" fill="#ff9090" font-size="11">Topic: user.registered</text>
  <rect x="350" y="326" width="260" height="28" rx="5" fill="#ff6b6b22" stroke="#ff6b6b" stroke-width="1"/>
  <text x="480" y="345" text-anchor="middle" fill="#ff9090" font-size="11">Topic: stock.reserved</text>
  <text x="480" y="370" text-anchor="middle" fill="#8b949e" font-size="10">Persists events on disk (Kafka log)</text>

  <!-- Consumers -->
  <text x="820" y="100" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">CONSUMERS</text>

  <rect x="740" y="110" width="200" height="52" rx="8" fill="#0a2010" stroke="#3fb950" stroke-width="2"/>
  <text x="840" y="132" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Notification Service</text>
  <text x="840" y="151" text-anchor="middle" fill="#85e89d" font-size="10">Sends email/SMS on OrderPlaced</text>

  <rect x="740" y="176" width="200" height="52" rx="8" fill="#1a0a28" stroke="#bc8cff" stroke-width="2"/>
  <text x="840" y="198" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">Inventory Service</text>
  <text x="840" y="217" text-anchor="middle" fill="#d2a8ff" font-size="10">Reserves stock on OrderPlaced</text>

  <rect x="740" y="242" width="200" height="52" rx="8" fill="#201500" stroke="#e3b341" stroke-width="2"/>
  <text x="840" y="264" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="bold">Analytics Service</text>
  <text x="840" y="283" text-anchor="middle" fill="#f0c060" font-size="10">Writes to data warehouse</text>

  <rect x="740" y="308" width="200" height="52" rx="8" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="840" y="330" text-anchor="middle" fill="#388bfd" font-size="12" font-weight="bold">Fraud Detection</text>
  <text x="840" y="349" text-anchor="middle" fill="#7ab8ff" font-size="10">ML model on PaymentCharged</text>

  <rect x="740" y="374" width="200" height="52" rx="8" fill="#200a0a" stroke="#f85149" stroke-width="2"/>
  <text x="840" y="396" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">Shipping Service</text>
  <text x="840" y="415" text-anchor="middle" fill="#ff7b72" font-size="10">Creates shipment on PaymentCharged</text>

  <!-- Arrows from broker to consumers -->
  <line x1="630" y1="230" x2="740" y2="136" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)" stroke-dasharray="5,3"/>
  <line x1="630" y1="250" x2="740" y2="202" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)" stroke-dasharray="5,3"/>
  <line x1="630" y1="268" x2="740" y2="268" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)" stroke-dasharray="5,3"/>
  <line x1="630" y1="295" x2="740" y2="334" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)" stroke-dasharray="5,3"/>
  <line x1="630" y1="330" x2="740" y2="400" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)" stroke-dasharray="5,3"/>

  <!-- Clean Arch note -->
  <rect x="30" y="470" width="900" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="480" y="493" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">Clean Architecture Mapping</text>
  <text x="480" y="514" text-anchor="middle" fill="#cccccc" font-size="12">IEventBus (interface / port) ← defined in Use Case layer · KafkaEventBus (adapter) ← in Infrastructure layer</text>
  <text x="480" y="534" text-anchor="middle" fill="#8b949e" font-size="11">Use case calls eventBus.publish(new OrderPlacedEvent(...)) — no Kafka import in business logic</text>

  <!-- Big tech row -->
  <text x="40" y="580" fill="#8b949e" font-size="12" font-weight="bold">Big Tech:</text>
  <text x="120" y="580" fill="#f85149" font-size="12">LinkedIn (invented Kafka)</text>
  <text x="310" y="580" fill="#bc8cff" font-size="12">Uber (location events)</text>
  <text x="480" y="580" fill="#e3b341" font-size="12">Airbnb (fraud detection)</text>
  <text x="660" y="580" fill="#388bfd" font-size="12">Twitter/X (tweet fan-out)</text>
  <text x="840" y="580" fill="#3fb950" font-size="12">AWS (EventBridge)</text>

  <text x="40" y="608" fill="#3fb950" font-size="11">✓ Loose coupling  ✓ Resilience  ✓ Free audit trail  ✓ Add consumers without touching producer</text>
  <text x="40" y="628" fill="#f85149" font-size="11">✗ Eventual consistency  ✗ Idempotency required  ✗ Hard debugging  ✗ Schema evolution</text>
</svg>
