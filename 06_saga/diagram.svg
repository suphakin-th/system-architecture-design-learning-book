<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="660" viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/></linearGradient>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f85149"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#388bfd"/></marker>
    <marker id="arrY" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e3b341"/></marker>
  </defs>
  <rect width="960" height="660" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Saga Pattern — Distributed Transaction Management</text>
  <text x="480" y="57" text-anchor="middle" fill="#8b949e" font-size="13">Orchestration style: Saga Orchestrator coordinates each service step with compensation on failure</text>

  <!-- Saga Orchestrator (center column) -->
  <rect x="335" y="80" width="290" height="90" rx="10" fill="#1a0a28" stroke="#bc8cff" stroke-width="3"/>
  <text x="480" y="104" text-anchor="middle" fill="#bc8cff" font-size="15" font-weight="bold">Saga Orchestrator</text>
  <text x="480" y="124" text-anchor="middle" fill="#d2a8ff" font-size="11">(Use Case spanning service boundaries)</text>
  <text x="480" y="143" text-anchor="middle" fill="#d2a8ff" font-size="11">PlaceOrderSaga — tracks step, handles failures</text>
  <text x="480" y="162" text-anchor="middle" fill="#8b949e" font-size="10">Persists saga state in SagaStateRepository</text>

  <!-- Steps flowing down with services -->
  <!-- Step 1: Payment -->
  <line x1="480" y1="170" x2="480" y2="205" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="510" y="194" fill="#bc8cff" font-size="10">1. ReservePayment</text>
  <rect x="160" y="205" width="640" height="60" rx="8" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="280" y="228" text-anchor="middle" fill="#388bfd" font-size="13" font-weight="bold">Payment Service</text>
  <text x="280" y="248" text-anchor="middle" fill="#7ab8ff" font-size="11">Reserves $99.90 on card → PaymentReserved ✓</text>
  <text x="680" y="228" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">FAIL: PaymentFailed ✗</text>
  <text x="680" y="248" text-anchor="middle" fill="#ff7b72" font-size="11">→ Saga ends (no compensation needed)</text>

  <!-- Step 2: Inventory -->
  <line x1="480" y1="265" x2="480" y2="300" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="510" y="290" fill="#bc8cff" font-size="10">2. ReserveStock</text>
  <rect x="160" y="300" width="640" height="60" rx="8" fill="#0a2010" stroke="#3fb950" stroke-width="2"/>
  <text x="280" y="323" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Inventory Service</text>
  <text x="280" y="343" text-anchor="middle" fill="#85e89d" font-size="11">Reserves 2×ProductA → StockReserved ✓</text>
  <text x="680" y="323" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">FAIL: StockFailed ✗</text>
  <text x="680" y="343" text-anchor="middle" fill="#ff7b72" font-size="11">→ Compensate: CancelPayment(orderId)</text>

  <!-- Step 3: Shipping -->
  <line x1="480" y1="360" x2="480" y2="395" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="510" y="386" fill="#bc8cff" font-size="10">3. CreateShipment</text>
  <rect x="160" y="395" width="640" height="60" rx="8" fill="#201500" stroke="#d29922" stroke-width="2"/>
  <text x="280" y="418" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">Shipping Service</text>
  <text x="280" y="438" text-anchor="middle" fill="#f0c060" font-size="11">Creates shipment → ShipmentCreated ✓</text>
  <text x="680" y="418" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">FAIL: ShipmentFailed ✗</text>
  <text x="680" y="438" text-anchor="middle" fill="#ff7b72" font-size="11">→ ReleaseStock + CancelPayment</text>

  <!-- Step 4: Confirm Order -->
  <line x1="480" y1="455" x2="480" y2="490" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="510" y="481" fill="#bc8cff" font-size="10">4. ConfirmOrder</text>
  <rect x="160" y="490" width="640" height="60" rx="8" fill="#1a0a28" stroke="#bc8cff" stroke-width="2"/>
  <text x="480" y="513" text-anchor="middle" fill="#bc8cff" font-size="13" font-weight="bold">Order Service — MarkOrderConfirmed</text>
  <text x="480" y="533" text-anchor="middle" fill="#d2a8ff" font-size="11">Order.status = CONFIRMED → publishes OrderConfirmed event ✓</text>

  <!-- Compensation arrows (right side) -->
  <rect x="820" y="205" width="120" height="345" rx="8" fill="#200505" stroke="#f85149" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="880" y="270" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Compensation</text>
  <text x="880" y="290" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Path</text>
  <text x="880" y="340" text-anchor="middle" fill="#ff9090" font-size="11" transform="rotate(-90,880,340)">Reverse order: Shipping → Inventory → Payment</text>

  <!-- State box -->
  <rect x="30" y="205" width="130" height="345" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="95" y="230" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="bold">Saga State</text>
  <text x="95" y="258" text-anchor="middle" fill="#6e7681" font-size="10">PENDING</text>
  <text x="95" y="290" text-anchor="middle" fill="#e3b341" font-size="10">PAYING</text>
  <text x="95" y="322" text-anchor="middle" fill="#e3b341" font-size="10">STOCKING</text>
  <text x="95" y="354" text-anchor="middle" fill="#e3b341" font-size="10">SHIPPING</text>
  <text x="95" y="386" text-anchor="middle" fill="#3fb950" font-size="10">CONFIRMED ✓</text>
  <text x="95" y="430" text-anchor="middle" fill="#f85149" font-size="10">or</text>
  <text x="95" y="460" text-anchor="middle" fill="#f85149" font-size="10">FAILED ✗</text>
  <text x="95" y="492" text-anchor="middle" fill="#6e7681" font-size="9">(persisted in DB)</text>

  <!-- Big tech -->
  <text x="40" y="582" fill="#8b949e" font-size="12" font-weight="bold">Big Tech:</text>
  <text x="120" y="582" fill="#bc8cff" font-size="12">Uber (trip lifecycle)</text>
  <text x="300" y="582" fill="#388bfd" font-size="12">Amazon (order fulfillment)</text>
  <text x="530" y="582" fill="#3fb950" font-size="12">Airbnb (booking saga)</text>
  <text x="720" y="582" fill="#e3b341" font-size="12">Klarna (BNPL)</text>

  <text x="40" y="612" fill="#3fb950" font-size="11">✓ No 2PC locks  ✓ Services stay autonomous  ✓ Long-running tx  ✓ Explicit compensation</text>
  <text x="40" y="632" fill="#f85149" font-size="11">✗ No atomicity  ✗ Complex compensation  ✗ Idempotency required  ✗ Very hard to test</text>
</svg>
