<?xml version="1.0" encoding="UTF-8"?>
<svg width="980" height="640" viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/></linearGradient>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f85149"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#388bfd"/></marker>
    <marker id="arrY" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e3b341"/></marker>
  </defs>
  <rect width="980" height="640" fill="url(#bg)"/>
  <text x="490" y="36" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">TikTok/ByteDance — Recommendation System Architecture</text>
  <text x="490" y="57" text-anchor="middle" fill="#8b949e" font-size="13">1.7B users · 100M+ videos/day · Cold start solved by behavioral signals · Online ML training</text>

  <!-- User opens TikTok -->
  <rect x="390" y="75" width="200" height="42" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="490" y="102" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">User Opens TikTok</text>
  <line x1="490" y1="117" x2="490" y2="148" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- 3-stage funnel -->
  <rect x="140" y="148" width="700" height="280" rx="10" fill="#0a0a0a" stroke="#e3b341" stroke-width="2"/>
  <text x="490" y="172" text-anchor="middle" fill="#e3b341" font-size="14" font-weight="bold">3-Stage Recommendation Funnel</text>

  <!-- Stage 1 -->
  <rect x="160" y="183" width="200" height="230" rx="8" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="260" y="205" text-anchor="middle" fill="#388bfd" font-size="12" font-weight="bold">Stage 1: Recall</text>
  <text x="260" y="222" text-anchor="middle" fill="#7ab8ff" font-size="10">1B videos → 10K candidates</text>
  <rect x="173" y="232" width="174" height="50" rx="4" fill="#0d1a40" stroke="#388bfd" stroke-width="1"/>
  <text x="260" y="252" text-anchor="middle" fill="#7ab8ff" font-size="10">Collaborative filtering:</text>
  <text x="260" y="268" text-anchor="middle" fill="#7ab8ff" font-size="10">similar users liked these</text>
  <rect x="173" y="290" width="174" height="50" rx="4" fill="#0d1a40" stroke="#388bfd" stroke-width="1"/>
  <text x="260" y="310" text-anchor="middle" fill="#7ab8ff" font-size="10">FAISS vector search:</text>
  <text x="260" y="326" text-anchor="middle" fill="#7ab8ff" font-size="10">nearest interest vectors</text>
  <rect x="173" y="348" width="174" height="50" rx="4" fill="#0d1a40" stroke="#388bfd" stroke-width="1"/>
  <text x="260" y="368" text-anchor="middle" fill="#7ab8ff" font-size="10">Trending: viral now</text>
  <text x="260" y="384" text-anchor="middle" fill="#7ab8ff" font-size="10">+ fresh uploads</text>

  <!-- Stage 2 -->
  <rect x="380" y="183" width="200" height="230" rx="8" fill="#0a2010" stroke="#3fb950" stroke-width="2"/>
  <text x="480" y="205" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Stage 2: Ranking</text>
  <text x="480" y="222" text-anchor="middle" fill="#85e89d" font-size="10">10K → Top 100</text>
  <rect x="393" y="232" width="174" height="50" rx="4" fill="#0a2810" stroke="#3fb950" stroke-width="1"/>
  <text x="480" y="252" text-anchor="middle" fill="#85e89d" font-size="10">Deep Neural Network</text>
  <text x="480" y="268" text-anchor="middle" fill="#85e89d" font-size="10">predicts completion rate</text>
  <rect x="393" y="290" width="174" height="50" rx="4" fill="#0a2810" stroke="#3fb950" stroke-width="1"/>
  <text x="480" y="310" text-anchor="middle" fill="#85e89d" font-size="10">Features: video length,</text>
  <text x="480" y="326" text-anchor="middle" fill="#85e89d" font-size="10">time of day, device type</text>
  <rect x="393" y="348" width="174" height="55" rx="4" fill="#1a3010" stroke="#3fb950" stroke-width="1.5"/>
  <text x="480" y="366" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Optimizes: completion rate</text>
  <text x="480" y="382" text-anchor="middle" fill="#85e89d" font-size="10">NOT likes (can be faked)</text>
  <text x="480" y="396" text-anchor="middle" fill="#3fb950" font-size="10">80% watch = strong signal</text>

  <!-- Stage 3 -->
  <rect x="600" y="183" width="220" height="230" rx="8" fill="#1a0a28" stroke="#bc8cff" stroke-width="2"/>
  <text x="710" y="205" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">Stage 3: Filtering</text>
  <text x="710" y="222" text-anchor="middle" fill="#d2a8ff" font-size="10">Top 100 → 5 shown + 5 preloaded</text>
  <rect x="613" y="232" width="194" height="35" rx="4" fill="#15082a" stroke="#bc8cff" stroke-width="1"/>
  <text x="710" y="255" text-anchor="middle" fill="#d2a8ff" font-size="10">Remove: seen videos</text>
  <rect x="613" y="275" width="194" height="35" rx="4" fill="#15082a" stroke="#bc8cff" stroke-width="1"/>
  <text x="710" y="298" text-anchor="middle" fill="#d2a8ff" font-size="10">Remove: policy violations</text>
  <rect x="613" y="318" width="194" height="35" rx="4" fill="#15082a" stroke="#bc8cff" stroke-width="1"/>
  <text x="710" y="341" text-anchor="middle" fill="#d2a8ff" font-size="10">Diversity rules: no 10× cooking</text>
  <rect x="613" y="361" width="194" height="45" rx="4" fill="#1a1035" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="710" y="381" text-anchor="middle" fill="#bc8cff" font-size="11" font-weight="bold">Pre-fetch next 5 videos</text>
  <text x="710" y="397" text-anchor="middle" fill="#d2a8ff" font-size="10">Hides latency → feels instant</text>

  <!-- Arrows between stages -->
  <line x1="360" y1="295" x2="380" y2="295" stroke="#e3b341" stroke-width="2" marker-end="url(#arrY)"/>
  <line x1="580" y1="295" x2="600" y2="295" stroke="#e3b341" stroke-width="2" marker-end="url(#arrY)"/>

  <!-- Real-time feedback loop -->
  <rect x="30" y="455" width="920" height="100" rx="8" fill="#0a0a0a" stroke="#f85149" stroke-width="2"/>
  <text x="490" y="477" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Real-Time Feedback Loop (Monolith Online Training)</text>
  <text x="110" y="502" text-anchor="middle" fill="#ff9090" font-size="11">User watches</text>
  <text x="110" y="518" text-anchor="middle" fill="#ff9090" font-size="11">80% of video</text>
  <text x="250" y="502" text-anchor="middle" fill="#e3b341" font-size="14">→</text>
  <text x="390" y="502" text-anchor="middle" fill="#cccccc" font-size="11">Kafka event</text>
  <text x="390" y="518" text-anchor="middle" fill="#cccccc" font-size="11">immediately</text>
  <text x="520" y="502" text-anchor="middle" fill="#e3b341" font-size="14">→</text>
  <text x="650" y="502" text-anchor="middle" fill="#cccccc" font-size="11">Monolith embedding</text>
  <text x="650" y="518" text-anchor="middle" fill="#cccccc" font-size="11">table updated</text>
  <text x="800" y="502" text-anchor="middle" fill="#e3b341" font-size="14">→</text>
  <text x="900" y="502" text-anchor="middle" fill="#3fb950" font-size="11">Model</text>
  <text x="900" y="518" text-anchor="middle" fill="#3fb950" font-size="11">improved</text>
  <text x="490" y="545" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">Result: Viral video goes from upload to appearing in millions of feeds in MINUTES (not hours like YouTube)</text>

  <text x="40" y="590" fill="#3fb950" font-size="11">✓ Cold start solved by behavioral signals  ✓ Completion rate beats likes  ✓ Online ML training = minutes to viral</text>
  <text x="40" y="610" fill="#f85149" font-size="11">✗ Filter bubble risk  ✗ Addictive by design  ✗ Geopolitical concerns about data  ✗ Extremely complex ML pipeline</text>
</svg>
