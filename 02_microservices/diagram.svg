<?xml version="1.0" encoding="UTF-8"?>
<svg width="980" height="700" viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/></linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#58a6ff"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arrY" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e3b341"/></marker>
  </defs>
  <rect width="980" height="700" fill="url(#bg)"/>
  <text x="490" y="36" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Microservices Architecture</text>
  <text x="490" y="57" text-anchor="middle" fill="#8b949e" font-size="13">Each service = independent process + own DB + own Clean Architecture stack</text>

  <!-- Client -->
  <rect x="380" y="75" width="220" height="42" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <text x="490" y="102" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Client (Browser / Mobile)</text>

  <!-- API Gateway -->
  <rect x="290" y="162" width="400" height="48" rx="8" fill="#1a2000" stroke="#e3b341" stroke-width="2.5"/>
  <text x="490" y="183" text-anchor="middle" fill="#e3b341" font-size="14" font-weight="bold">API Gateway</text>
  <text x="490" y="200" text-anchor="middle" fill="#f0c060" font-size="11">Auth · Rate Limit · Route · Load Balance · SSL Termination</text>
  <line x1="490" y1="117" x2="490" y2="162" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Helper: service box macro -->
  <!-- User Service -->
  <rect x="25" y="266" width="195" height="215" rx="10" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="122" y="287" text-anchor="middle" fill="#388bfd" font-size="13" font-weight="bold">User Service</text>
  <rect x="38" y="295" width="169" height="32" rx="5" fill="#ff6b6b18" stroke="#ff6b6b" stroke-width="1"/>
  <text x="122" y="316" text-anchor="middle" fill="#ff6b6b" font-size="11">domain/ User, Profile</text>
  <rect x="38" y="334" width="169" height="32" rx="5" fill="#e3b34118" stroke="#e3b341" stroke-width="1"/>
  <text x="122" y="355" text-anchor="middle" fill="#e3b341" font-size="11">application/ RegisterUser</text>
  <rect x="38" y="373" width="169" height="32" rx="5" fill="#3fb95018" stroke="#3fb950" stroke-width="1"/>
  <text x="122" y="394" text-anchor="middle" fill="#3fb950" font-size="11">adapters/ REST ctrl</text>
  <rect x="38" y="412" width="169" height="32" rx="5" fill="#388bfd18" stroke="#388bfd" stroke-width="1"/>
  <text x="122" y="433" text-anchor="middle" fill="#388bfd" font-size="11">infra/ Express, pg</text>
  <rect x="38" y="450" width="169" height="22" rx="4" fill="#0a1628" stroke="#58a6ff" stroke-width="1"/>
  <text x="122" y="465" text-anchor="middle" fill="#58a6ff" font-size="10">PostgreSQL (users DB)</text>

  <!-- Order Service -->
  <rect x="250" y="266" width="195" height="215" rx="10" fill="#0a2010" stroke="#3fb950" stroke-width="2"/>
  <text x="347" y="287" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Order Service</text>
  <rect x="263" y="295" width="169" height="32" rx="5" fill="#ff6b6b18" stroke="#ff6b6b" stroke-width="1"/>
  <text x="347" y="316" text-anchor="middle" fill="#ff6b6b" font-size="11">domain/ Order, Item</text>
  <rect x="263" y="334" width="169" height="32" rx="5" fill="#e3b34118" stroke="#e3b341" stroke-width="1"/>
  <text x="347" y="355" text-anchor="middle" fill="#e3b341" font-size="11">application/ PlaceOrder</text>
  <rect x="263" y="373" width="169" height="32" rx="5" fill="#3fb95018" stroke="#3fb950" stroke-width="1"/>
  <text x="347" y="394" text-anchor="middle" fill="#3fb950" font-size="11">adapters/ REST + events</text>
  <rect x="263" y="412" width="169" height="32" rx="5" fill="#388bfd18" stroke="#388bfd" stroke-width="1"/>
  <text x="347" y="433" text-anchor="middle" fill="#388bfd" font-size="11">infra/ Express, pg</text>
  <rect x="263" y="450" width="169" height="22" rx="4" fill="#0a2010" stroke="#3fb950" stroke-width="1"/>
  <text x="347" y="465" text-anchor="middle" fill="#3fb950" font-size="10">PostgreSQL (orders DB)</text>

  <!-- Product Service -->
  <rect x="475" y="266" width="195" height="215" rx="10" fill="#1a0a28" stroke="#bc8cff" stroke-width="2"/>
  <text x="572" y="287" text-anchor="middle" fill="#bc8cff" font-size="13" font-weight="bold">Product Service</text>
  <rect x="488" y="295" width="169" height="32" rx="5" fill="#ff6b6b18" stroke="#ff6b6b" stroke-width="1"/>
  <text x="572" y="316" text-anchor="middle" fill="#ff6b6b" font-size="11">domain/ Product, SKU</text>
  <rect x="488" y="334" width="169" height="32" rx="5" fill="#e3b34118" stroke="#e3b341" stroke-width="1"/>
  <text x="572" y="355" text-anchor="middle" fill="#e3b341" font-size="11">application/ Search</text>
  <rect x="488" y="373" width="169" height="32" rx="5" fill="#3fb95018" stroke="#3fb950" stroke-width="1"/>
  <text x="572" y="394" text-anchor="middle" fill="#3fb950" font-size="11">adapters/ REST ctrl</text>
  <rect x="488" y="412" width="169" height="32" rx="5" fill="#388bfd18" stroke="#388bfd" stroke-width="1"/>
  <text x="572" y="433" text-anchor="middle" fill="#388bfd" font-size="11">infra/ Fastify, Mongo</text>
  <rect x="488" y="450" width="169" height="22" rx="4" fill="#1a0a28" stroke="#bc8cff" stroke-width="1"/>
  <text x="572" y="465" text-anchor="middle" fill="#bc8cff" font-size="10">MongoDB (products DB)</text>

  <!-- Payment Service -->
  <rect x="700" y="266" width="255" height="215" rx="10" fill="#201500" stroke="#d29922" stroke-width="2"/>
  <text x="827" y="287" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">Payment Service</text>
  <rect x="713" y="295" width="229" height="32" rx="5" fill="#ff6b6b18" stroke="#ff6b6b" stroke-width="1"/>
  <text x="827" y="316" text-anchor="middle" fill="#ff6b6b" font-size="11">domain/ Payment, Transaction</text>
  <rect x="713" y="334" width="229" height="32" rx="5" fill="#e3b34118" stroke="#e3b341" stroke-width="1"/>
  <text x="827" y="355" text-anchor="middle" fill="#e3b341" font-size="11">application/ ChargeCard, Refund</text>
  <rect x="713" y="373" width="229" height="32" rx="5" fill="#3fb95018" stroke="#3fb950" stroke-width="1"/>
  <text x="827" y="394" text-anchor="middle" fill="#3fb950" font-size="11">adapters/ REST, StripeGateway</text>
  <rect x="713" y="412" width="229" height="32" rx="5" fill="#388bfd18" stroke="#388bfd" stroke-width="1"/>
  <text x="827" y="433" text-anchor="middle" fill="#388bfd" font-size="11">infra/ Express, pg, Stripe SDK</text>
  <rect x="713" y="450" width="229" height="22" rx="4" fill="#201500" stroke="#d29922" stroke-width="1"/>
  <text x="827" y="465" text-anchor="middle" fill="#d29922" font-size="10">PostgreSQL (payments DB)</text>

  <!-- Gateway to services lines -->
  <line x1="390" y1="210" x2="168" y2="266" stroke="#e3b341" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arrY)"/>
  <line x1="430" y1="210" x2="347" y2="266" stroke="#e3b341" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arrY)"/>
  <line x1="530" y1="210" x2="572" y2="266" stroke="#e3b341" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arrY)"/>
  <line x1="600" y1="210" x2="780" y2="266" stroke="#e3b341" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arrY)"/>

  <!-- Async message bus -->
  <rect x="180" y="530" width="620" height="48" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="490" y="551" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">Message Bus / Event Broker</text>
  <text x="490" y="569" text-anchor="middle" fill="#ff7b72" font-size="11">Kafka / RabbitMQ — OrderPlaced, PaymentCharged, StockReserved events</text>

  <line x1="200" y1="481" x2="240" y2="530" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrG)"/>
  <line x1="347" y1="481" x2="380" y2="530" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrG)"/>
  <line x1="572" y1="481" x2="560" y2="530" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrG)"/>
  <line x1="780" y1="481" x2="730" y2="530" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrG)"/>

  <!-- Big tech logos text -->
  <text x="40" y="614" fill="#8b949e" font-size="12" font-weight="bold">Big Tech:</text>
  <text x="115" y="614" fill="#388bfd" font-size="12">Amazon (1000+ svcs)</text>
  <text x="285" y="614" fill="#3fb950" font-size="12">Netflix (700+ svcs)</text>
  <text x="445" y="614" fill="#bc8cff" font-size="12">Uber (DOMA)</text>
  <text x="580" y="614" fill="#d29922" font-size="12">Airbnb (SOA)</text>
  <text x="700" y="614" fill="#58a6ff" font-size="12">LinkedIn (Kafka origin)</text>

  <!-- Benefits -->
  <text x="40" y="643" fill="#3fb950" font-size="11">✓ Indep scaling  ✓ Fault isolation  ✓ Team autonomy  ✓ Tech diversity  ✓ Targeted deploy</text>
  <text x="40" y="660" fill="#f85149" font-size="11">✗ Network latency  ✗ Distributed txns  ✗ Op complexity  ✗ Hard testing  ✗ Data duplication</text>
  <text x="40" y="677" fill="#8b949e" font-size="10">Each service is its own Clean Architecture app — network boundary = Clean Architecture module boundary</text>
</svg>
