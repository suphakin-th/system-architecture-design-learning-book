<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/></linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#58a6ff"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arrY" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e3b341"/></marker>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">API Gateway Pattern</text>
  <text x="480" y="57" text-anchor="middle" fill="#8b949e" font-size="13">Single entry point — auth, rate-limit, route, transform — before services ever see the request</text>

  <!-- Clients -->
  <rect x="30" y="80" width="140" height="52" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="100" y="101" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="bold">Browser</text>
  <text x="100" y="121" text-anchor="middle" fill="#8b949e" font-size="10">HTTPS REST</text>

  <rect x="30" y="150" width="140" height="52" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="100" y="171" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="bold">Mobile App</text>
  <text x="100" y="191" text-anchor="middle" fill="#8b949e" font-size="10">HTTPS REST</text>

  <rect x="30" y="220" width="140" height="52" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="100" y="241" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="bold">3rd Party API</text>
  <text x="100" y="261" text-anchor="middle" fill="#8b949e" font-size="10">HTTPS REST</text>

  <!-- Arrows to gateway -->
  <line x1="170" y1="106" x2="230" y2="200" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="170" y1="176" x2="230" y2="210" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="170" y1="246" x2="230" y2="225" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- API Gateway -->
  <rect x="230" y="120" width="290" height="200" rx="12" fill="#1a1000" stroke="#e3b341" stroke-width="3"/>
  <text x="375" y="146" text-anchor="middle" fill="#e3b341" font-size="16" font-weight="bold">API Gateway</text>
  <text x="375" y="164" text-anchor="middle" fill="#f0c060" font-size="11">Kong / AWS API GW / Nginx / Envoy</text>
  <rect x="248" y="172" width="254" height="24" rx="4" fill="#388bfd22" stroke="#388bfd" stroke-width="1"/>
  <text x="375" y="188" text-anchor="middle" fill="#7ab8ff" font-size="11">1. SSL Termination (HTTPS→HTTP)</text>
  <rect x="248" y="202" width="254" height="24" rx="4" fill="#f8514922" stroke="#f85149" stroke-width="1"/>
  <text x="375" y="218" text-anchor="middle" fill="#ff7b72" font-size="11">2. Auth (JWT / OAuth2 / API Key)</text>
  <rect x="248" y="232" width="254" height="24" rx="4" fill="#bc8cff22" stroke="#bc8cff" stroke-width="1"/>
  <text x="375" y="248" text-anchor="middle" fill="#d2a8ff" font-size="11">3. Rate Limiting (100 req/min)</text>
  <rect x="248" y="262" width="254" height="24" rx="4" fill="#3fb95022" stroke="#3fb950" stroke-width="1"/>
  <text x="375" y="278" text-anchor="middle" fill="#85e89d" font-size="11">4. Route + Load Balance</text>
  <rect x="248" y="292" width="254" height="22" rx="4" fill="#e3b34122" stroke="#e3b341" stroke-width="1"/>
  <text x="375" y="307" text-anchor="middle" fill="#f0c060" font-size="11">5. Transform + Cache + Log</text>

  <!-- Services -->
  <rect x="640" y="80" width="290" height="60" rx="8" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="785" y="106" text-anchor="middle" fill="#388bfd" font-size="14" font-weight="bold">User Service :3001</text>
  <text x="785" y="126" text-anchor="middle" fill="#7ab8ff" font-size="11">GET /users/me · POST /auth/login</text>

  <rect x="640" y="160" width="290" height="60" rx="8" fill="#0a2010" stroke="#3fb950" stroke-width="2"/>
  <text x="785" y="186" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">Order Service :3002</text>
  <text x="785" y="206" text-anchor="middle" fill="#85e89d" font-size="11">POST /orders · GET /orders/:id</text>

  <rect x="640" y="240" width="290" height="60" rx="8" fill="#1a0a28" stroke="#bc8cff" stroke-width="2"/>
  <text x="785" y="266" text-anchor="middle" fill="#bc8cff" font-size="14" font-weight="bold">Product Service :3003</text>
  <text x="785" y="286" text-anchor="middle" fill="#d2a8ff" font-size="11">GET /products · GET /products/search</text>

  <rect x="640" y="320" width="290" height="60" rx="8" fill="#201500" stroke="#d29922" stroke-width="2"/>
  <text x="785" y="346" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">Payment Service :3004</text>
  <text x="785" y="366" text-anchor="middle" fill="#f0c060" font-size="11">POST /payments · GET /payments/:id</text>

  <!-- Routing rules table -->
  <rect x="530" y="80" width="108" height="300" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="584" y="100" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="bold">Routing Rules</text>
  <text x="584" y="120" text-anchor="middle" fill="#6e7681" font-size="9">/api/users/*</text>
  <text x="584" y="135" text-anchor="middle" fill="#3fb950" font-size="9">→ :3001</text>
  <text x="584" y="158" text-anchor="middle" fill="#6e7681" font-size="9">/api/orders/*</text>
  <text x="584" y="173" text-anchor="middle" fill="#3fb950" font-size="9">→ :3002</text>
  <text x="584" y="198" text-anchor="middle" fill="#6e7681" font-size="9">/api/products/*</text>
  <text x="584" y="213" text-anchor="middle" fill="#3fb950" font-size="9">→ :3003</text>
  <text x="584" y="238" text-anchor="middle" fill="#6e7681" font-size="9">/api/payments/*</text>
  <text x="584" y="253" text-anchor="middle" fill="#3fb950" font-size="9">→ :3004</text>
  <text x="584" y="285" text-anchor="middle" fill="#6e7681" font-size="9">/v1/* → old svc</text>
  <text x="584" y="300" text-anchor="middle" fill="#3fb950" font-size="9">/v2/* → new svc</text>
  <text x="584" y="335" text-anchor="middle" fill="#6e7681" font-size="9">x-user-id: header</text>
  <text x="584" y="350" text-anchor="middle" fill="#6e7681" font-size="9">injected after auth</text>
  <text x="584" y="370" text-anchor="middle" fill="#6e7681" font-size="9">Services never</text>
  <text x="584" y="382" text-anchor="middle" fill="#6e7681" font-size="9">see raw JWT</text>

  <!-- Gateway to routing rules to services -->
  <line x1="520" y1="178" x2="530" y2="178" stroke="#e3b341" stroke-width="1.5" marker-end="url(#arrY)"/>
  <line x1="638" y1="110" x2="640" y2="110" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="638" y1="190" x2="640" y2="190" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="638" y1="270" x2="640" y2="270" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="638" y1="350" x2="640" y2="350" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- HA note -->
  <rect x="230" y="340" width="290" height="55" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="375" y="361" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">⚠ Gateway = Single Point of Failure</text>
  <text x="375" y="381" text-anchor="middle" fill="#8b949e" font-size="11">Must be clustered: ≥2 instances + health check</text>

  <!-- Big tech -->
  <text x="40" y="438" fill="#8b949e" font-size="12" font-weight="bold">Big Tech:</text>
  <text x="120" y="438" fill="#e3b341" font-size="12">Netflix (Zuul)</text>
  <text x="265" y="438" fill="#388bfd" font-size="12">Amazon (AWS API GW)</text>
  <text x="470" y="438" fill="#bc8cff" font-size="12">Uber (GAPIC)</text>
  <text x="615" y="438" fill="#3fb950" font-size="12">Airbnb (Gatekeeper)</text>
  <text x="790" y="438" fill="#d29922" font-size="12">Kong OSS</text>

  <text x="40" y="466" fill="#3fb950" font-size="11">✓ Single entry point  ✓ DRY cross-cutting  ✓ API versioning  ✓ Protocol translation</text>
  <text x="40" y="484" fill="#f85149" font-size="11">✗ SPOF if not clustered  ✗ Extra latency  ✗ No business logic (anti-pattern if violated)</text>
</svg>
