<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="580" viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/></linearGradient>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#ff5a5f"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arrY" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e3b341"/></marker>
  </defs>
  <rect width="960" height="580" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Airbnb Architecture — SOA Migration + GraphQL BFF</text>
  <text x="480" y="57" text-anchor="middle" fill="#8b949e" font-size="13">Rails monolith → failed first SOA attempt → domain boundaries first → successful extraction</text>

  <!-- Clients -->
  <rect x="30" y="80" width="120" height="42" rx="8" fill="#21262d" stroke="#ff5a5f" stroke-width="2"/>
  <text x="90" y="107" text-anchor="middle" fill="#ff5a5f" font-size="12" font-weight="bold">Web (React)</text>
  <rect x="30" y="136" width="120" height="42" rx="8" fill="#21262d" stroke="#ff5a5f" stroke-width="2"/>
  <text x="90" y="163" text-anchor="middle" fill="#ff5a5f" font-size="12" font-weight="bold">iOS / Android</text>

  <!-- GraphQL BFF -->
  <rect x="200" y="80" width="280" height="100" rx="8" fill="#0a0a20" stroke="#ff5a5f" stroke-width="2.5"/>
  <text x="340" y="104" text-anchor="middle" fill="#ff5a5f" font-size="13" font-weight="bold">GraphQL API (BFF Layer)</text>
  <text x="340" y="122" text-anchor="middle" fill="#ff9090" font-size="11">Client asks for EXACTLY what it needs</text>
  <text x="200" y="145" fill="#ff9090" font-size="10" text-anchor="middle"> </text>
  <rect x="215" y="138" width="120" height="30" rx="4" fill="#1a0a10" stroke="#ff5a5f" stroke-width="1"/>
  <text x="275" y="158" text-anchor="middle" fill="#ff9090" font-size="10">Web: 50 fields</text>
  <rect x="345" y="138" width="120" height="30" rx="4" fill="#1a0a10" stroke="#ff5a5f" stroke-width="1"/>
  <text x="405" y="158" text-anchor="middle" fill="#ff9090" font-size="10">Mobile: 15 fields</text>
  <text x="340" y="176" text-anchor="middle" fill="#ff5a5f" font-size="10">Both served by ONE GraphQL endpoint</text>

  <!-- Arrows clients to GraphQL -->
  <line x1="150" y1="101" x2="200" y2="115" stroke="#ff5a5f" stroke-width="1.5" marker-end="url(#arrR)"/>
  <line x1="150" y1="157" x2="200" y2="145" stroke="#ff5a5f" stroke-width="1.5" marker-end="url(#arrR)"/>

  <!-- Services -->
  <rect x="520" y="80" width="420" height="310" rx="10" fill="#0a1020" stroke="#ff5a5f" stroke-width="2"/>
  <text x="730" y="104" text-anchor="middle" fill="#ff5a5f" font-size="14" font-weight="bold">Downstream Services (SOA)</text>
  <text x="730" y="122" text-anchor="middle" fill="#ff9090" font-size="11">Extracted in priority order: risk + value, not difficulty</text>

  <rect x="535" y="132" width="380" height="55" rx="6" fill="#0a2010" stroke="#3fb950" stroke-width="1.5"/>
  <text x="725" y="152" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">1st Extracted: Payments Service</text>
  <text x="725" y="170" text-anchor="middle" fill="#85e89d" font-size="10">Clearest boundary + financial compliance requirement + highest risk in monolith</text>

  <rect x="535" y="195" width="380" height="55" rx="6" fill="#0a1628" stroke="#388bfd" stroke-width="1.5"/>
  <text x="725" y="215" text-anchor="middle" fill="#388bfd" font-size="12" font-weight="bold">2nd: Messaging Service</text>
  <text x="725" y="233" text-anchor="middle" fill="#7ab8ff" font-size="10">Clear boundary (messages between users) + near-zero circular dependencies</text>

  <rect x="535" y="258" width="380" height="55" rx="6" fill="#1a0a28" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="725" y="278" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">3rd: Search Service</text>
  <text x="725" y="296" text-anchor="middle" fill="#d2a8ff" font-size="10">Compute-heavy, needs Elasticsearch independently; natural isolation</text>

  <rect x="535" y="321" width="380" height="55" rx="6" fill="#201500" stroke="#d29922" stroke-width="1.5"/>
  <text x="725" y="341" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">4th: Reviews Service</text>
  <text x="725" y="359" text-anchor="middle" fill="#f0c060" font-size="10">Clearest domain, lowest coupling; extracted last (lowest risk)</text>

  <!-- Arrow GraphQL to services -->
  <line x1="480" y1="150" x2="520" y2="200" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrY)"/>
  <line x1="480" y1="155" x2="520" y2="262" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrY)"/>
  <line x1="480" y1="160" x2="520" y2="322" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrY)"/>
  <line x1="480" y1="165" x2="520" y2="349" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrY)"/>

  <!-- The lesson box -->
  <rect x="30" y="250" width="470" height="140" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="265" y="273" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">Why the First SOA Attempt FAILED (2015–2016)</text>
  <text x="50" y="295" fill="#ff9090" font-size="11">1. Circular dependencies: PaymentService needed UserService</text>
  <text x="50" y="313" fill="#ff9090" font-size="11">   UserService needed PaymentService → can't split</text>
  <text x="50" y="331" fill="#ff9090" font-size="11">2. Domain boundaries not clear before service extraction</text>
  <text x="50" y="349" fill="#ff9090" font-size="11">3. Migration behind schedule → abandoned after 1 year</text>
  <text x="265" y="375" text-anchor="middle" fill="#e3b341" font-size="11" font-weight="bold">Lesson: Validate boundaries INSIDE monolith first, THEN extract</text>

  <!-- Rails remaining -->
  <rect x="200" y="250" width="280" height="100" rx="8" fill="#200505" stroke="#f85149" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="340" y="273" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">Rails Monolith (Shrinking)</text>
  <text x="340" y="292" text-anchor="middle" fill="#ff9090" font-size="10">Remaining modules being extracted</text>
  <text x="340" y="310" text-anchor="middle" fill="#ff9090" font-size="10">via Strangler Fig pattern</text>
  <text x="340" y="328" text-anchor="middle" fill="#ff9090" font-size="10">New orders go to new services</text>
  <text x="340" y="344" text-anchor="middle" fill="#ff9090" font-size="10">Old orders stay in Rails</text>
  <line x1="340" y1="196" x2="340" y2="250" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrR)"/>

  <!-- Key lessons -->
  <rect x="30" y="416" width="900" height="130" rx="8" fill="#0a0a0a" stroke="#30363d" stroke-width="1.5"/>
  <text x="480" y="437" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">Senior → Junior: Why Airbnb's Story Is the Most Important Case Study</text>
  <text x="50" y="458" fill="#cccccc" font-size="11">1. "Define boundaries first, then extract" — The most common SOA mistake is extracting before understanding dependencies</text>
  <text x="50" y="476" fill="#cccccc" font-size="11">2. GraphQL is NOT a microservice — it's a BFF (Interface Adapter) that aggregates services for each client type</text>
  <text x="50" y="494" fill="#cccccc" font-size="11">3. Circular dependencies reveal you don't understand your domain — fix the domain model, THEN split</text>
  <text x="50" y="512" fill="#3fb950" font-size="11">4. Strangler Fig = the right migration path — extract in parallel, never freeze the monolith, validate each extraction</text>
  <text x="50" y="530" fill="#ff5a5f" font-size="11">5. SOA is a people problem first — teams need to agree on ownership boundaries before the code is split</text>
</svg>
