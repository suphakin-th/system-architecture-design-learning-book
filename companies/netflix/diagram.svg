<?xml version="1.0" encoding="UTF-8"?>
<svg width="980" height="680" viewBox="0 0 980 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/></linearGradient>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f85149"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#388bfd"/></marker>
  </defs>
  <rect width="980" height="680" fill="url(#bg)"/>
  <text x="490" y="36" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Netflix Architecture — Failure-First Design</text>
  <text x="490" y="57" text-anchor="middle" fill="#8b949e" font-size="13">2008 outage → "Never a single point of failure again" → 700+ microservices + Chaos Engineering</text>

  <!-- Client + API Gateway -->
  <rect x="380" y="75" width="220" height="42" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="490" y="102" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">Client (TV/Mobile/Web)</text>
  <line x1="490" y1="117" x2="490" y2="148" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- Zuul API Gateway -->
  <rect x="320" y="148" width="340" height="48" rx="8" fill="#1a1000" stroke="#e3b341" stroke-width="2"/>
  <text x="490" y="170" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">Zuul API Gateway</text>
  <text x="490" y="187" text-anchor="middle" fill="#f0c060" font-size="11">Auth · Rate Limit · Dynamic Routing · A/B Testing</text>

  <!-- Core services row 1 -->
  <line x1="370" y1="196" x2="175" y2="250" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrG)"/>
  <line x1="430" y1="196" x2="360" y2="250" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrG)"/>
  <line x1="490" y1="196" x2="490" y2="250" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrG)"/>
  <line x1="560" y1="196" x2="640" y2="250" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrG)"/>
  <line x1="620" y1="196" x2="840" y2="250" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrG)"/>

  <!-- Services -->
  <rect x="60" y="250" width="200" height="90" rx="8" fill="#0a2010" stroke="#3fb950" stroke-width="2"/>
  <text x="160" y="272" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Recommendation Service</text>
  <text x="160" y="290" text-anchor="middle" fill="#85e89d" font-size="10">ML: collaborative filtering</text>
  <text x="160" y="306" text-anchor="middle" fill="#85e89d" font-size="10">Cassandra (per-user history)</text>
  <text x="160" y="324" text-anchor="middle" fill="#f85149" font-size="10" font-weight="bold">Fallback: regional top 20 →</text>
  <text x="160" y="336" text-anchor="middle" fill="#f85149" font-size="9">→ global top 20 (3 levels)</text>

  <rect x="280" y="250" width="160" height="90" rx="8" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="360" y="272" text-anchor="middle" fill="#388bfd" font-size="12" font-weight="bold">User Service</text>
  <text x="360" y="290" text-anchor="middle" fill="#7ab8ff" font-size="10">Auth, profiles</text>
  <text x="360" y="306" text-anchor="middle" fill="#7ab8ff" font-size="10">MySQL (RDS)</text>
  <text x="360" y="324" text-anchor="middle" fill="#f85149" font-size="10">Circuit breaker</text>
  <text x="360" y="338" text-anchor="middle" fill="#f85149" font-size="9">(Hystrix)</text>

  <rect x="410" y="250" width="160" height="90" rx="8" fill="#1a0a28" stroke="#bc8cff" stroke-width="2"/>
  <text x="490" y="272" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">Content Service</text>
  <text x="490" y="290" text-anchor="middle" fill="#d2a8ff" font-size="10">Metadata, ratings</text>
  <text x="490" y="306" text-anchor="middle" fill="#d2a8ff" font-size="10">Cassandra + MySQL</text>
  <text x="490" y="324" text-anchor="middle" fill="#f85149" font-size="10">Circuit breaker</text>
  <text x="490" y="338" text-anchor="middle" fill="#f85149" font-size="9">(Hystrix)</text>

  <rect x="590" y="250" width="180" height="90" rx="8" fill="#201500" stroke="#d29922" stroke-width="2"/>
  <text x="680" y="272" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">Streaming Service</text>
  <text x="680" y="290" text-anchor="middle" fill="#f0c060" font-size="10">Session mgmt</text>
  <text x="680" y="306" text-anchor="middle" fill="#f0c060" font-size="10">Cassandra (sessions)</text>
  <text x="680" y="324" text-anchor="middle" fill="#f0c060" font-size="10">→ Open Connect CDN</text>
  <text x="680" y="338" text-anchor="middle" fill="#f0c060" font-size="9">18K servers, 1K locations</text>

  <rect x="790" y="250" width="160" height="90" rx="8" fill="#200505" stroke="#f85149" stroke-width="2"/>
  <text x="870" y="272" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">Billing Service</text>
  <text x="870" y="290" text-anchor="middle" fill="#ff9090" font-size="10">Subscriptions</text>
  <text x="870" y="306" text-anchor="middle" fill="#ff9090" font-size="10">MySQL (ACID)</text>
  <text x="870" y="324" text-anchor="middle" fill="#ff9090" font-size="10">Stripe integration</text>
  <text x="870" y="338" text-anchor="middle" fill="#f85149" font-size="9">Circuit breaker</text>

  <!-- Chaos Monkey box -->
  <rect x="30" y="380" width="240" height="100" rx="8" fill="#200505" stroke="#f85149" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="150" y="402" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Chaos Monkey 🐒</text>
  <text x="150" y="422" text-anchor="middle" fill="#ff7b72" font-size="11">Randomly kills EC2 instances</text>
  <text x="150" y="440" text-anchor="middle" fill="#ff7b72" font-size="11">In PRODUCTION. Every day.</text>
  <text x="150" y="460" text-anchor="middle" fill="#ffaaaa" font-size="10">Chaos Gorilla: kills entire AZ</text>
  <text x="150" y="476" text-anchor="middle" fill="#ffaaaa" font-size="10">Chaos Kong: kills entire region</text>

  <!-- Hystrix Circuit Breaker -->
  <rect x="290" y="380" width="220" height="100" rx="8" fill="#1a0508" stroke="#f85149" stroke-width="2"/>
  <text x="400" y="402" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Hystrix Circuit Breaker</text>
  <text x="400" y="422" text-anchor="middle" fill="#ff9090" font-size="11">CLOSED: normal operation</text>
  <text x="400" y="440" text-anchor="middle" fill="#ff9090" font-size="11">OPEN: 50%+ failures → fallback</text>
  <text x="400" y="458" text-anchor="middle" fill="#ff9090" font-size="11">HALF-OPEN: test recovery</text>
  <text x="400" y="476" text-anchor="middle" fill="#ffaaaa" font-size="10">Netflix open-sourced this (2012)</text>

  <!-- Eureka Service Discovery -->
  <rect x="530" y="380" width="200" height="100" rx="8" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="630" y="402" text-anchor="middle" fill="#388bfd" font-size="13" font-weight="bold">Eureka</text>
  <text x="630" y="422" text-anchor="middle" fill="#7ab8ff" font-size="11">Service Registry</text>
  <text x="630" y="440" text-anchor="middle" fill="#7ab8ff" font-size="11">Services register themselves</text>
  <text x="630" y="458" text-anchor="middle" fill="#7ab8ff" font-size="11">Clients query registry</text>
  <text x="630" y="476" text-anchor="middle" fill="#388bfd" font-size="10">Netflix open-sourced this too</text>

  <!-- Kafka -->
  <rect x="750" y="380" width="200" height="100" rx="8" fill="#201500" stroke="#d29922" stroke-width="2"/>
  <text x="850" y="402" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">Kafka + Flink</text>
  <text x="850" y="422" text-anchor="middle" fill="#f0c060" font-size="11">Viewing events stream</text>
  <text x="850" y="440" text-anchor="middle" fill="#f0c060" font-size="11">Recommendation training data</text>
  <text x="850" y="458" text-anchor="middle" fill="#f0c060" font-size="11">Analytics pipeline</text>
  <text x="850" y="476" text-anchor="middle" fill="#d29922" font-size="10">300M+ viewing events/day</text>

  <!-- Clean Arch note -->
  <rect x="30" y="510" width="920" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="490" y="530" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="bold">Clean Architecture Mapping</text>
  <text x="490" y="550" text-anchor="middle" fill="#cccccc" font-size="11">Hystrix = infrastructure layer · Use cases call IRecommendationService (port) · Fallback logic is a use case concern, not infrastructure</text>

  <text x="40" y="605" fill="#3fb950" font-size="11">✓ 700+ microservices  ✓ Chaos Engineering  ✓ Circuit breakers everywhere  ✓ Graceful degradation</text>
  <text x="40" y="625" fill="#f85149" font-size="11">✗ Huge operational complexity  ✗ Distributed debugging  ✗ Cassandra management at scale</text>
  <text x="40" y="645" fill="#e3b341" font-size="11">Key lesson: Design for failure, not for success. If Hystrix didn't exist, Netflix would have crashed in 2011.</text>
</svg>
