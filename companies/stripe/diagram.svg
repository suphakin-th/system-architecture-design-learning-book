<?xml version="1.0" encoding="UTF-8"?>
<svg width="980" height="620" viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/></linearGradient>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#635bff"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arrY" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e3b341"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f85149"/></marker>
  </defs>
  <rect width="980" height="620" fill="url(#bg)"/>
  <text x="490" y="36" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Stripe Architecture — Idempotency + Event Sourcing + 10-Year API</text>
  <text x="490" y="57" text-anchor="middle" fill="#8b949e" font-size="13">$1T+ payments/year · Zero money lost · API from 2011 still works · Every cent auditable forever</text>

  <!-- Client -->
  <rect x="380" y="75" width="220" height="42" rx="8" fill="#21262d" stroke="#635bff" stroke-width="2"/>
  <text x="490" y="102" text-anchor="middle" fill="#635bff" font-size="13" font-weight="bold">Merchant App (POST /charges)</text>
  <text x="490" y="116" text-anchor="middle" fill="#8b949e" font-size="10">Header: Idempotency-Key: idem_2XjA8mN</text>
  <line x1="490" y1="117" x2="490" y2="148" stroke="#635bff" stroke-width="1.8" marker-end="url(#arrB)"/>

  <!-- Idempotency Gate -->
  <rect x="290" y="148" width="400" height="70" rx="8" fill="#0a0820" stroke="#635bff" stroke-width="2.5"/>
  <text x="490" y="172" text-anchor="middle" fill="#635bff" font-size="13" font-weight="bold">Idempotency Gate</text>
  <text x="490" y="191" text-anchor="middle" fill="#7ab8ff" font-size="11">Hash key → check Redis · Already processed? Return stored result · No → acquire lock → proceed</text>

  <!-- Event Sourcing (PaymentIntent) -->
  <rect x="150" y="258" width="340" height="200" rx="10" fill="#0a0820" stroke="#635bff" stroke-width="2"/>
  <text x="320" y="282" text-anchor="middle" fill="#635bff" font-size="13" font-weight="bold">PaymentIntent (Event-Sourced)</text>
  <rect x="165" y="292" width="310" height="28" rx="4" fill="#15082a" stroke="#635bff" stroke-width="1"/>
  <text x="320" y="311" text-anchor="middle" fill="#635bff" font-size="11">PaymentIntentCreated {amount: $100}</text>
  <rect x="165" y="326" width="310" height="28" rx="4" fill="#15082a" stroke="#635bff" stroke-width="1"/>
  <text x="320" y="345" text-anchor="middle" fill="#635bff" font-size="11">PaymentMethodAttached {card: ...}</text>
  <rect x="165" y="360" width="310" height="28" rx="4" fill="#15082a" stroke="#635bff" stroke-width="1"/>
  <text x="320" y="379" text-anchor="middle" fill="#635bff" font-size="11">ChargeAttempted {attempt: 1}</text>
  <rect x="165" y="394" width="310" height="28" rx="4" fill="#15082a" stroke="#635bff" stroke-width="1"/>
  <text x="320" y="413" text-anchor="middle" fill="#635bff" font-size="11">ChargeFailed {decline: insufficient funds}</text>
  <rect x="165" y="428" width="310" height="22" rx="4" fill="#0a2010" stroke="#3fb950" stroke-width="1.5"/>
  <text x="320" y="443" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">ChargeSucceeded {charge_id: ch_abc}</text>

  <line x1="490" y1="218" x2="370" y2="258" stroke="#635bff" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- Reconciliation -->
  <rect x="510" y="258" width="320" height="200" rx="10" fill="#200505" stroke="#f85149" stroke-width="2"/>
  <text x="670" y="282" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Reconciliation Jobs</text>
  <text x="670" y="300" text-anchor="middle" fill="#ff9090" font-size="11">When events lie (network partitions)</text>
  <rect x="525" y="312" width="290" height="55" rx="4" fill="#200505" stroke="#f85149" stroke-width="1"/>
  <text x="670" y="332" text-anchor="middle" fill="#ff9090" font-size="11" font-weight="bold">Every hour:</text>
  <text x="670" y="350" text-anchor="middle" fill="#ff9090" font-size="10">charges with status "unknown" →</text>
  <text x="670" y="364" text-anchor="middle" fill="#ff9090" font-size="10">query Visa/Mastercard directly</text>
  <rect x="525" y="375" width="290" height="55" rx="4" fill="#200505" stroke="#f85149" stroke-width="1"/>
  <text x="670" y="395" text-anchor="middle" fill="#ff9090" font-size="11" font-weight="bold">Every day:</text>
  <text x="670" y="413" text-anchor="middle" fill="#ff9090" font-size="10">compare ledger vs bank settlement</text>
  <text x="670" y="429" text-anchor="middle" fill="#ff9090" font-size="10">any discrepancy → alert + fix</text>
  <text x="670" y="453" text-anchor="middle" fill="#f85149" font-size="10">Distributed systems lie. Reconcile against ground truth.</text>

  <!-- API Versioning -->
  <rect x="30" y="490" width="460" height="90" rx="8" fill="#161b22" stroke="#635bff" stroke-width="1.5"/>
  <text x="260" y="512" text-anchor="middle" fill="#635bff" font-size="13" font-weight="bold">API Versioning — Never Break Changes</text>
  <text x="50" y="532" fill="#cccccc" font-size="11">Developer in 2011 builds on Stripe API. Still works in 2026. Never had to update.</text>
  <text x="50" y="550" fill="#cccccc" font-size="11">Version pinned per account: all calls use YOUR API version's response schema</text>
  <text x="50" y="568" fill="#3fb950" font-size="11">Version adapter = Interface Adapter in Clean Architecture — same domain objects, different DTO per version</text>

  <!-- Clean Arch mapping -->
  <rect x="510" y="490" width="440" height="90" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="730" y="512" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">Clean Architecture Mapping</text>
  <text x="530" y="532" fill="#cccccc" font-size="11">PaymentIntent = Entity (aggregate, reconstituted from events)</text>
  <text x="530" y="550" fill="#cccccc" font-size="11">ChargeCardUseCase = Use Case (calls IIdempotencyStore, IPaymentGateway)</text>
  <text x="530" y="568" fill="#cccccc" font-size="11">Redis/Postgres/Visa API = Infrastructure adapters</text>

  <text x="40" y="608" fill="#3fb950" font-size="11">✓ Idempotency = never double-charge  ✓ Event sourcing = every cent auditable  ✓ 13-year API backward compatibility</text>
</svg>
