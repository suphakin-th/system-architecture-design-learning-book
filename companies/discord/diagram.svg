<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/></linearGradient>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#5865f2"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f85149"/></marker>
  </defs>
  <rect width="960" height="640" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Discord Architecture — From Cassandra to ScyllaDB</text>
  <text x="480" y="57" text-anchor="middle" fill="#8b949e" font-size="13">Elixir for real-time connections · Rust for data services · ScyllaDB for trillions of messages</text>

  <!-- Client connections -->
  <rect x="30" y="80" width="120" height="42" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="90" y="107" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="bold">Discord Client</text>
  <rect x="30" y="140" width="120" height="42" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="90" y="167" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="bold">Mobile Client</text>

  <!-- WebSocket Gateway (Elixir) -->
  <rect x="200" y="80" width="240" height="220" rx="10" fill="#0d0f2b" stroke="#5865f2" stroke-width="2.5"/>
  <text x="320" y="104" text-anchor="middle" fill="#5865f2" font-size="14" font-weight="bold">Elixir WebSocket Gateway</text>
  <text x="320" y="122" text-anchor="middle" fill="#7289da" font-size="11">5M+ concurrent WebSocket connections</text>
  <rect x="215" y="133" width="210" height="60" rx="6" fill="#0f1250" stroke="#5865f2" stroke-width="1"/>
  <text x="320" y="153" text-anchor="middle" fill="#5865f2" font-size="12" font-weight="bold">Erlang VM (BEAM)</text>
  <text x="320" y="171" text-anchor="middle" fill="#7289da" font-size="10">1 process per user connection = 2KB</text>
  <text x="320" y="188" text-anchor="middle" fill="#7289da" font-size="10">2M+ connections per server</text>
  <rect x="215" y="200" width="210" height="50" rx="6" fill="#0f1250" stroke="#5865f2" stroke-width="1"/>
  <text x="320" y="220" text-anchor="middle" fill="#5865f2" font-size="12" font-weight="bold">VoiceChannel GenServer</text>
  <text x="320" y="238" text-anchor="middle" fill="#7289da" font-size="10">One actor per voice channel</text>
  <rect x="215" y="257" width="210" height="35" rx="6" fill="#0f1250" stroke="#5865f2" stroke-width="1"/>
  <text x="320" y="279" text-anchor="middle" fill="#5865f2" font-size="11">Supervisor: auto-restart crashed actors</text>

  <line x1="150" y1="101" x2="200" y2="155" stroke="#5865f2" stroke-width="1.8" marker-end="url(#arrB)"/>
  <line x1="150" y1="161" x2="200" y2="175" stroke="#5865f2" stroke-width="1.8" marker-end="url(#arrB)"/>

  <!-- Message Rust Service -->
  <rect x="480" y="80" width="220" height="180" rx="10" fill="#0a1a0a" stroke="#3fb950" stroke-width="2.5"/>
  <text x="590" y="104" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">Message Data Service</text>
  <text x="590" y="122" text-anchor="middle" fill="#85e89d" font-size="11">(Rust — zero GC pauses)</text>
  <rect x="495" y="133" width="190" height="50" rx="6" fill="#0a2010" stroke="#3fb950" stroke-width="1"/>
  <text x="590" y="153" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Rust gRPC Server</text>
  <text x="590" y="171" text-anchor="middle" fill="#85e89d" font-size="10">Deterministic performance</text>
  <text x="590" y="188" text-anchor="middle" fill="#85e89d" font-size="10">No garbage collector pauses</text>
  <rect x="495" y="190" width="190" height="60" rx="6" fill="#0a2010" stroke="#3fb950" stroke-width="1"/>
  <text x="590" y="210" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">Shard Key: channel + bucket</text>
  <text x="590" y="228" text-anchor="middle" fill="#85e89d" font-size="10">bucket = msg_id / (10 days msgs)</text>
  <text x="590" y="245" text-anchor="middle" fill="#85e89d" font-size="10">Prevents hot partition per channel</text>

  <line x1="440" y1="180" x2="480" y2="180" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>

  <!-- Database comparison -->
  <rect x="740" y="80" width="200" height="180" rx="10" fill="#0a0a0a" stroke="#30363d" stroke-width="1.5"/>
  <text x="840" y="104" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="bold">Database Evolution</text>
  <rect x="755" y="115" width="170" height="70" rx="6" fill="#200505" stroke="#f85149" stroke-width="1.5"/>
  <text x="840" y="136" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">Cassandra (OLD)</text>
  <text x="840" y="153" text-anchor="middle" fill="#ff9090" font-size="10">177 nodes, JVM GC pauses</text>
  <text x="840" y="169" text-anchor="middle" fill="#ff9090" font-size="10">p99 latency: 40–125ms ✗</text>
  <rect x="755" y="195" width="170" height="55" rx="6" fill="#0a2010" stroke="#3fb950" stroke-width="2"/>
  <text x="840" y="216" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">ScyllaDB (NEW)</text>
  <text x="840" y="234" text-anchor="middle" fill="#85e89d" font-size="10">C++ (no JVM), fewer nodes</text>
  <text x="840" y="248" text-anchor="middle" fill="#3fb950" font-size="10">p99 latency: 15ms ✓ (8×)</text>

  <line x1="700" y1="175" x2="740" y2="175" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- Voice architecture -->
  <rect x="200" y="320" width="520" height="130" rx="10" fill="#0d0f2b" stroke="#5865f2" stroke-width="2"/>
  <text x="460" y="344" text-anchor="middle" fill="#5865f2" font-size="14" font-weight="bold">Voice Architecture (UDP + Elixir SFU)</text>
  <text x="200" y="344" fill="#5865f2" font-size="10" text-anchor="middle"> </text>
  <rect x="215" y="355" width="230" height="80" rx="6" fill="#0f1250" stroke="#5865f2" stroke-width="1"/>
  <text x="330" y="374" text-anchor="middle" fill="#5865f2" font-size="11" font-weight="bold">Why UDP for voice (not TCP)</text>
  <text x="330" y="392" text-anchor="middle" fill="#7289da" font-size="10">TCP retransmits lost packets</text>
  <text x="330" y="408" text-anchor="middle" fill="#7289da" font-size="10">Old audio packet is useless</text>
  <text x="330" y="424" text-anchor="middle" fill="#7289da" font-size="10">UDP: lose it, play silence → better</text>
  <rect x="455" y="355" width="250" height="80" rx="6" fill="#0f1250" stroke="#5865f2" stroke-width="1"/>
  <text x="580" y="374" text-anchor="middle" fill="#5865f2" font-size="11" font-weight="bold">SFU (Selective Forwarding Unit)</text>
  <text x="580" y="392" text-anchor="middle" fill="#7289da" font-size="10">User A speaks → SFU receives</text>
  <text x="580" y="408" text-anchor="middle" fill="#7289da" font-size="10">SFU forwards to all others</text>
  <text x="580" y="424" text-anchor="middle" fill="#7289da" font-size="10">One inbound, N outbound streams</text>

  <!-- Clean arch mapping -->
  <rect x="30" y="475" width="900" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="480" y="497" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">Clean Architecture Mapping</text>
  <text x="50" y="518" fill="#cccccc" font-size="11">Elixir GenServer = Entity + Use Case (VoiceChannel actor IS the aggregate with business rules)</text>
  <text x="50" y="536" fill="#cccccc" font-size="11">Rust gRPC Service = Interface Adapter (outbound) — IMessageRepository → ScyllaDB via Rust adapter</text>
  <text x="50" y="554" fill="#cccccc" font-size="11">Elixir Supervisor = Framework & Drivers — auto-restart; use cases never interact with supervisor directly</text>

  <text x="40" y="600" fill="#3fb950" font-size="11">✓ 5M concurrent connections  ✓ ScyllaDB: 8× latency improvement  ✓ Hot partition solved by bucket shard key</text>
  <text x="40" y="620" fill="#f85149" font-size="11">✗ Cassandra migration was a 12-month project  ✗ Erlang/Rust expertise required  ✗ Custom shard key logic is complex</text>
</svg>
