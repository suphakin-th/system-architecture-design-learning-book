<?xml version="1.0" encoding="UTF-8"?>
<svg width="980" height="700" viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/></linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e3b341"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f85149"/></marker>
  </defs>
  <rect width="980" height="700" fill="url(#bg)"/>
  <text x="490" y="36" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Amazon Architecture Evolution</text>
  <text x="490" y="57" text-anchor="middle" fill="#8b949e" font-size="13">From OBIDOS Perl monolith (1994) → Bezos Mandate (2002) → Domain Microservices + AWS (present)</text>

  <!-- Phase 1: Monolith -->
  <rect x="20" y="80" width="190" height="280" rx="10" fill="#200505" stroke="#f85149" stroke-width="2"/>
  <text x="115" y="104" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">Phase 1 (1994–2002)</text>
  <text x="115" y="122" text-anchor="middle" fill="#ff7b72" font-size="11">OBIDOS Perl Monolith</text>
  <rect x="35" y="132" width="160" height="26" rx="4" fill="#330000" stroke="#f85149" stroke-width="1"/>
  <text x="115" y="150" text-anchor="middle" fill="#ff9090" font-size="10">Catalog logic</text>
  <rect x="35" y="164" width="160" height="26" rx="4" fill="#330000" stroke="#f85149" stroke-width="1"/>
  <text x="115" y="182" text-anchor="middle" fill="#ff9090" font-size="10">Cart logic</text>
  <rect x="35" y="196" width="160" height="26" rx="4" fill="#330000" stroke="#f85149" stroke-width="1"/>
  <text x="115" y="214" text-anchor="middle" fill="#ff9090" font-size="10">Checkout logic</text>
  <rect x="35" y="228" width="160" height="26" rx="4" fill="#330000" stroke="#f85149" stroke-width="1"/>
  <text x="115" y="246" text-anchor="middle" fill="#ff9090" font-size="10">Recommendations</text>
  <rect x="35" y="260" width="160" height="26" rx="4" fill="#330000" stroke="#f85149" stroke-width="1"/>
  <text x="115" y="278" text-anchor="middle" fill="#ff9090" font-size="10">Order fulfillment</text>
  <rect x="35" y="296" width="160" height="40" rx="4" fill="#0a0505" stroke="#8b949e" stroke-width="1"/>
  <text x="115" y="312" text-anchor="middle" fill="#8b949e" font-size="10">Oracle DB</text>
  <text x="115" y="328" text-anchor="middle" fill="#6e7681" font-size="9">(one giant DB)</text>
  <text x="115" y="348" fill="#f85149" font-size="10" text-anchor="middle">Problems:</text>
  <text x="115" y="363" fill="#ff9090" font-size="9" text-anchor="middle">• Teams block each other</text>
  <text x="115" y="376" fill="#ff9090" font-size="9" text-anchor="middle">• Risky deploys</text>
  <text x="115" y="389" fill="#ff9090" font-size="9" text-anchor="middle">• No independent scale</text>

  <!-- Arrow to phase 2 -->
  <text x="230" y="225" fill="#e3b341" font-size="10" text-anchor="middle">Bezos</text>
  <text x="230" y="239" fill="#e3b341" font-size="10" text-anchor="middle">Mandate</text>
  <text x="230" y="253" fill="#e3b341" font-size="10" text-anchor="middle">2002 →</text>
  <line x1="210" y1="230" x2="250" y2="230" stroke="#e3b341" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Phase 2: SOA -->
  <rect x="250" y="80" width="220" height="280" rx="10" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="360" y="104" text-anchor="middle" fill="#388bfd" font-size="13" font-weight="bold">Phase 2 (2002–2010)</text>
  <text x="360" y="122" text-anchor="middle" fill="#7ab8ff" font-size="11">SOA — Two-Pizza Teams</text>
  <rect x="265" y="132" width="190" height="30" rx="5" fill="#0a2010" stroke="#3fb950" stroke-width="1.5"/>
  <text x="360" y="152" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">ProductCatalogService</text>
  <rect x="265" y="170" width="190" height="30" rx="5" fill="#0a2010" stroke="#3fb950" stroke-width="1.5"/>
  <text x="360" y="190" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">ShoppingCartService</text>
  <rect x="265" y="208" width="190" height="30" rx="5" fill="#0a2010" stroke="#3fb950" stroke-width="1.5"/>
  <text x="360" y="228" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">CheckoutService</text>
  <rect x="265" y="246" width="190" height="30" rx="5" fill="#0a2010" stroke="#3fb950" stroke-width="1.5"/>
  <text x="360" y="266" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">RecommendationService</text>
  <rect x="265" y="284" width="190" height="30" rx="5" fill="#0a2010" stroke="#3fb950" stroke-width="1.5"/>
  <text x="360" y="304" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">FulfillmentService</text>
  <text x="360" y="348" fill="#3fb950" font-size="10" text-anchor="middle">Each service:</text>
  <text x="360" y="362" fill="#85e89d" font-size="9" text-anchor="middle">• Own team (≤8 people)</text>
  <text x="360" y="376" fill="#85e89d" font-size="9" text-anchor="middle">• Own database</text>
  <text x="360" y="389" fill="#85e89d" font-size="9" text-anchor="middle">• Own deploy pipeline</text>

  <!-- Arrow to phase 3 -->
  <line x1="470" y1="230" x2="510" y2="230" stroke="#e3b341" stroke-width="2" marker-end="url(#arr)"/>
  <text x="490" y="222" fill="#e3b341" font-size="10" text-anchor="middle">AWS</text>
  <text x="490" y="244" fill="#e3b341" font-size="10" text-anchor="middle">born →</text>

  <!-- Phase 3: DOMA + AWS -->
  <rect x="510" y="80" width="450" height="530" rx="10" fill="#0a1a0a" stroke="#3fb950" stroke-width="2.5"/>
  <text x="735" y="104" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">Phase 3 (2010–present): DOMA + AWS</text>
  <text x="735" y="122" text-anchor="middle" fill="#85e89d" font-size="11">Domain-Oriented Microservices on Amazon's own cloud</text>

  <!-- Shopping Domain -->
  <rect x="525" y="133" width="200" height="120" rx="8" fill="#0a2010" stroke="#3fb950" stroke-width="1.5"/>
  <text x="625" y="153" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Shopping Domain</text>
  <text x="625" y="170" text-anchor="middle" fill="#85e89d" font-size="10">ProductCatalogService → DynamoDB</text>
  <text x="625" y="186" text-anchor="middle" fill="#85e89d" font-size="10">SearchService → OpenSearch</text>
  <text x="625" y="202" text-anchor="middle" fill="#85e89d" font-size="10">PricingService → ElastiCache</text>
  <text x="625" y="218" text-anchor="middle" fill="#85e89d" font-size="10">RecommendationsService → ML</text>
  <text x="625" y="240" text-anchor="middle" fill="#3fb950" font-size="9">Team: ~6 engineers</text>

  <!-- Orders Domain -->
  <rect x="745" y="133" width="200" height="120" rx="8" fill="#0a1628" stroke="#388bfd" stroke-width="1.5"/>
  <text x="845" y="153" text-anchor="middle" fill="#388bfd" font-size="12" font-weight="bold">Orders Domain</text>
  <text x="845" y="170" text-anchor="middle" fill="#7ab8ff" font-size="10">ShoppingCartService → DynamoDB</text>
  <text x="845" y="186" text-anchor="middle" fill="#7ab8ff" font-size="10">CheckoutService → Aurora</text>
  <text x="845" y="202" text-anchor="middle" fill="#7ab8ff" font-size="10">OrderMgmtService → SQS</text>
  <text x="845" y="218" text-anchor="middle" fill="#7ab8ff" font-size="10">ReturnService → Aurora</text>
  <text x="845" y="240" text-anchor="middle" fill="#388bfd" font-size="9">Team: ~8 engineers</text>

  <!-- Fulfillment Domain -->
  <rect x="525" y="268" width="200" height="120" rx="8" fill="#1a0a28" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="625" y="288" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">Fulfillment Domain</text>
  <text x="625" y="305" text-anchor="middle" fill="#d2a8ff" font-size="10">InventoryService → DynamoDB</text>
  <text x="625" y="321" text-anchor="middle" fill="#d2a8ff" font-size="10">WarehouseService → Aurora</text>
  <text x="625" y="337" text-anchor="middle" fill="#d2a8ff" font-size="10">ShippingService → SQS+SNS</text>
  <text x="625" y="353" text-anchor="middle" fill="#d2a8ff" font-size="10">TrackingService → DynamoDB</text>
  <text x="625" y="375" text-anchor="middle" fill="#bc8cff" font-size="9">Team: ~7 engineers</text>

  <!-- Payments Domain -->
  <rect x="745" y="268" width="200" height="120" rx="8" fill="#201500" stroke="#d29922" stroke-width="1.5"/>
  <text x="845" y="288" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">Payments Domain</text>
  <text x="845" y="305" text-anchor="middle" fill="#f0c060" font-size="10">PaymentProcessingService</text>
  <text x="845" y="321" text-anchor="middle" fill="#f0c060" font-size="10">FraudDetectionService → ML</text>
  <text x="845" y="337" text-anchor="middle" fill="#f0c060" font-size="10">RefundService → Aurora</text>
  <text x="845" y="353" text-anchor="middle" fill="#f0c060" font-size="10">PayoutService → Kinesis</text>
  <text x="845" y="375" text-anchor="middle" fill="#d29922" font-size="9">Team: ~6 engineers</text>

  <!-- AWS Backbone -->
  <rect x="525" y="403" width="420" height="185" rx="8" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
  <text x="735" y="423" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">AWS Infrastructure (born from Amazon's internal need)</text>
  <rect x="535" y="433" width="120" height="40" rx="5" fill="#0a2010" stroke="#3fb950" stroke-width="1"/>
  <text x="595" y="450" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">DynamoDB</text>
  <text x="595" y="466" text-anchor="middle" fill="#85e89d" font-size="9">Always available KV</text>
  <rect x="665" y="433" width="120" height="40" rx="5" fill="#0a1628" stroke="#388bfd" stroke-width="1"/>
  <text x="725" y="450" text-anchor="middle" fill="#388bfd" font-size="11" font-weight="bold">SQS + SNS</text>
  <text x="725" y="466" text-anchor="middle" fill="#7ab8ff" font-size="9">Async decoupling</text>
  <rect x="795" y="433" width="140" height="40" rx="5" fill="#1a0a28" stroke="#bc8cff" stroke-width="1"/>
  <text x="865" y="450" text-anchor="middle" fill="#bc8cff" font-size="11" font-weight="bold">Aurora + RDS</text>
  <text x="865" y="466" text-anchor="middle" fill="#d2a8ff" font-size="9">Relational transactions</text>
  <rect x="535" y="483" width="120" height="40" rx="5" fill="#201500" stroke="#d29922" stroke-width="1"/>
  <text x="595" y="500" text-anchor="middle" fill="#d29922" font-size="11" font-weight="bold">Kinesis</text>
  <text x="595" y="516" text-anchor="middle" fill="#f0c060" font-size="9">Event streaming</text>
  <rect x="665" y="483" width="120" height="40" rx="5" fill="#1a1000" stroke="#e3b341" stroke-width="1"/>
  <text x="725" y="500" text-anchor="middle" fill="#e3b341" font-size="11" font-weight="bold">ElastiCache</text>
  <text x="725" y="516" text-anchor="middle" fill="#f0c060" font-size="9">Redis caching</text>
  <rect x="795" y="483" width="140" height="40" rx="5" fill="#0a2010" stroke="#3fb950" stroke-width="1"/>
  <text x="865" y="500" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">CloudFront CDN</text>
  <text x="865" y="516" text-anchor="middle" fill="#85e89d" font-size="9">Edge content delivery</text>
  <text x="735" y="570" text-anchor="middle" fill="#e3b341" font-size="11" font-weight="bold">Bezos Mandate Rule: "All teams expose data via service interfaces. No back doors."</text>

  <!-- Benefits summary -->
  <rect x="20" y="490" width="480" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="260" y="511" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">The Bezos Mandate in Clean Architecture Terms</text>
  <text x="40" y="531" fill="#85e89d" font-size="11">"All teams must expose via service interfaces"  =  Every module must define an IPort (interface)</text>
  <text x="40" y="549" fill="#85e89d" font-size="11">"No direct DB access"  =  Clean Architecture Dependency Rule: no outer importing inner</text>
  <text x="40" y="567" fill="#85e89d" font-size="11">"Two-pizza teams"  =  one bounded context per team  =  one microservice per team</text>
  <text x="40" y="585" fill="#3fb950" font-size="11">Result: 1000+ services, each independently deployable, independently scalable</text>

  <text x="40" y="638" fill="#3fb950" font-size="11">✓ Independent scaling  ✓ Team autonomy  ✓ Fault isolation  ✓ AWS built for the world from Amazon's own problems</text>
  <text x="40" y="658" fill="#f85149" font-size="11">✗ Distributed transactions (Saga)  ✗ Network latency  ✗ Operational complexity</text>
</svg>
