<?xml version="1.0" encoding="UTF-8"?>
<svg width="980" height="600" viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/></linearGradient>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#ff3008"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#388bfd"/></marker>
    <marker id="arrY" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e3b341"/></marker>
  </defs>
  <rect width="980" height="600" fill="url(#bg)"/>
  <text x="490" y="36" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">DoorDash Architecture — 80M Req/Sec + Three-Sided Marketplace</text>
  <text x="490" y="57" text-anchor="middle" fill="#8b949e" font-size="13">Consumer + Merchant + Dasher coordination · Service mesh saved millions in AWS costs</text>

  <!-- Three actors -->
  <rect x="20" y="75" width="140" height="80" rx="8" fill="#21262d" stroke="#ff3008" stroke-width="2"/>
  <text x="90" y="100" text-anchor="middle" fill="#ff3008" font-size="13" font-weight="bold">Consumer</text>
  <text x="90" y="118" text-anchor="middle" fill="#ff7b72" font-size="10">Places order</text>
  <text x="90" y="134" text-anchor="middle" fill="#ff7b72" font-size="10">Tracks delivery</text>

  <rect x="420" y="75" width="140" height="80" rx="8" fill="#21262d" stroke="#e3b341" stroke-width="2"/>
  <text x="490" y="100" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">Merchant</text>
  <text x="490" y="118" text-anchor="middle" fill="#f0c060" font-size="10">Accepts order</text>
  <text x="490" y="134" text-anchor="middle" fill="#f0c060" font-size="10">Prepares food</text>

  <rect x="820" y="75" width="140" height="80" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
  <text x="890" y="100" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Dasher</text>
  <text x="890" y="118" text-anchor="middle" fill="#85e89d" font-size="10">Picks up order</text>
  <text x="890" y="134" text-anchor="middle" fill="#85e89d" font-size="10">Delivers to consumer</text>

  <!-- 3-way saga -->
  <rect x="200" y="75" width="200" height="80" rx="8" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="300" y="100" text-anchor="middle" fill="#388bfd" font-size="12" font-weight="bold">OrderService</text>
  <text x="300" y="118" text-anchor="middle" fill="#7ab8ff" font-size="10">Cadence Saga Orchestrator</text>
  <text x="300" y="134" text-anchor="middle" fill="#7ab8ff" font-size="10">Coordinates all 3 actors</text>

  <rect x="600" y="75" width="200" height="80" rx="8" fill="#0a2010" stroke="#3fb950" stroke-width="2"/>
  <text x="700" y="100" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">DispatchService</text>
  <text x="700" y="118" text-anchor="middle" fill="#85e89d" font-size="10">H3 geospatial matching</text>
  <text x="700" y="134" text-anchor="middle" fill="#85e89d" font-size="10">Greedy VRP algorithm</text>

  <line x1="160" y1="115" x2="200" y2="115" stroke="#ff3008" stroke-width="1.8" marker-end="url(#arrR)"/>
  <line x1="560" y1="115" x2="600" y2="115" stroke="#e3b341" stroke-width="1.8" marker-end="url(#arrY)"/>
  <line x1="800" y1="115" x2="760" y2="115" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>

  <!-- Service mesh cost savings -->
  <rect x="20" y="185" width="460" height="200" rx="10" fill="#0a1020" stroke="#388bfd" stroke-width="2.5"/>
  <text x="250" y="209" text-anchor="middle" fill="#388bfd" font-size="14" font-weight="bold">Envoy Service Mesh: Zone-Aware Routing</text>
  <text x="250" y="227" text-anchor="middle" fill="#7ab8ff" font-size="11">The biggest cost optimization in DoorDash's history</text>
  <rect x="35" y="237" width="430" height="60" rx="5" fill="#200505" stroke="#f85149" stroke-width="1.5"/>
  <text x="250" y="258" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">Without zone-aware routing:</text>
  <text x="250" y="276" text-anchor="middle" fill="#ff9090" font-size="10">Service A (us-east-1a) → Service B (us-east-1b) = cross-AZ</text>
  <text x="250" y="291" text-anchor="middle" fill="#ff9090" font-size="10">AWS charges $0.01/GB · 80M req/sec × 10KB = millions/hour</text>
  <rect x="35" y="305" width="430" height="60" rx="5" fill="#0a2010" stroke="#3fb950" stroke-width="1.5"/>
  <text x="250" y="326" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">With zone-aware routing (Envoy config):</text>
  <text x="250" y="344" text-anchor="middle" fill="#85e89d" font-size="10">Service A (us-east-1a) → prefer Service B in us-east-1a</text>
  <text x="250" y="359" text-anchor="middle" fill="#85e89d" font-size="10">Cross-AZ only if no same-AZ instance available</text>
  <text x="250" y="375" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">AWS called DoorDash: "Is this a production incident?" Cost drop was so dramatic</text>

  <!-- CockroachDB config platform -->
  <rect x="500" y="185" width="460" height="200" rx="10" fill="#0a2010" stroke="#3fb950" stroke-width="2"/>
  <text x="730" y="209" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">CockroachDB for Configuration</text>
  <text x="730" y="227" text-anchor="middle" fill="#85e89d" font-size="11">700K+ merchants × many config values each</text>
  <rect x="515" y="237" width="430" height="50" rx="5" fill="#200505" stroke="#f85149" stroke-width="1.5"/>
  <text x="730" y="258" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">Old: update merchant hours = commit to git repo</text>
  <text x="730" y="273" text-anchor="middle" fill="#ff9090" font-size="10">= code review + CI/CD deploy = 1 day minimum</text>
  <rect x="515" y="295" width="430" height="80" rx="5" fill="#0a2810" stroke="#3fb950" stroke-width="1.5"/>
  <text x="730" y="315" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">New: merchant self-service portal → CockroachDB</text>
  <text x="730" y="333" text-anchor="middle" fill="#85e89d" font-size="10">Strong consistency across 3 AWS regions</text>
  <text x="730" y="349" text-anchor="middle" fill="#85e89d" font-size="10">Update takes effect globally in &lt;1 minute</text>
  <text x="730" y="363" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">From 1 day → 1 minute for merchant config updates</text>

  <!-- Dispatch algorithm -->
  <rect x="20" y="410" width="460" height="120" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="250" y="432" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">Dispatch Algorithm — NP-Hard → Good Enough in 100ms</text>
  <text x="40" y="454" fill="#f0c060" font-size="11">Vehicle Routing Problem (VRP) = NP-hard. Can't solve optimally in &lt;100ms</text>
  <text x="40" y="472" fill="#f0c060" font-size="11">DoorDash solution: greedy algorithm — good enough, not optimal</text>
  <text x="40" y="490" fill="#f0c060" font-size="11">Score each Dasher: distance + rating + prep time + batching opportunity</text>
  <text x="40" y="508" fill="#3fb950" font-size="11">Batching: one Dasher picks up 2 orders from same restaurant = more efficient</text>

  <!-- Clean arch -->
  <rect x="500" y="410" width="460" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="730" y="432" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">Clean Architecture Mapping</text>
  <text x="520" y="454" fill="#cccccc" font-size="11">DispatchAlgorithm = Domain Service (pure function, no imports)</text>
  <text x="520" y="472" fill="#cccccc" font-size="11">CockroachDB repo = IConfigRepository adapter (infrastructure)</text>
  <text x="520" y="490" fill="#cccccc" font-size="11">Envoy sidecar = Framework & Drivers (services 100% unaware)</text>
  <text x="520" y="508" fill="#3fb950" font-size="11">Use cases never import Envoy/CockroachDB SDK directly</text>

  <text x="40" y="558" fill="#3fb950" font-size="11">✓ Zone-aware routing saved millions in AWS costs  ✓ CockroachDB: 1 day → 1 minute config  ✓ Greedy VRP works at 80M req/sec</text>
  <text x="40" y="578" fill="#f85149" font-size="11">✗ 3-actor coordination requires Saga  ✗ Istio complexity requires dedicated platform team  ✗ NP-hard dispatch = approximate, not optimal</text>
</svg>
