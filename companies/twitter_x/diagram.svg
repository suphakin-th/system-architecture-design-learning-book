<?xml version="1.0" encoding="UTF-8"?>
<svg width="980" height="620" viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/></linearGradient>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#1da1f2"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f85149"/></marker>
    <marker id="arrY" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e3b341"/></marker>
  </defs>
  <rect width="980" height="620" fill="url(#bg)"/>
  <text x="490" y="36" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Twitter/X Architecture — The Fanout Problem</text>
  <text x="490" y="57" text-anchor="middle" fill="#8b949e" font-size="13">Fail Whale (2009) → Hybrid fanout: push for &lt;10K followers, pull for celebrities</text>

  <!-- Tweet written -->
  <rect x="20" y="80" width="170" height="42" rx="8" fill="#21262d" stroke="#1da1f2" stroke-width="2"/>
  <text x="105" y="107" text-anchor="middle" fill="#1da1f2" font-size="12" font-weight="bold">@user posts tweet</text>
  <line x1="190" y1="101" x2="230" y2="101" stroke="#1da1f2" stroke-width="1.8" marker-end="url(#arrB)"/>

  <!-- Fanout decision -->
  <rect x="230" y="75" width="230" height="55" rx="8" fill="#0a1020" stroke="#1da1f2" stroke-width="2"/>
  <text x="345" y="97" text-anchor="middle" fill="#1da1f2" font-size="12" font-weight="bold">Fanout Service</text>
  <text x="345" y="115" text-anchor="middle" fill="#7ab8ff" font-size="10">How many followers does this user have?</text>

  <!-- Regular user path -->
  <rect x="100" y="170" width="280" height="130" rx="8" fill="#0a2010" stroke="#3fb950" stroke-width="2"/>
  <text x="240" y="193" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Regular User (&lt;10K followers)</text>
  <text x="240" y="211" text-anchor="middle" fill="#85e89d" font-size="10">Fanout on WRITE</text>
  <rect x="115" y="220" width="250" height="35" rx="5" fill="#0a2810" stroke="#3fb950" stroke-width="1"/>
  <text x="240" y="242" text-anchor="middle" fill="#85e89d" font-size="10">For each follower: ZADD timeline:{follower_id}</text>
  <text x="240" y="256" text-anchor="middle" fill="#85e89d" font-size="10">{timestamp} {tweet_id}</text>
  <rect x="115" y="263" width="250" height="30" rx="5" fill="#0a2810" stroke="#3fb950" stroke-width="1"/>
  <text x="240" y="283" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold">10K Redis writes = ~50ms</text>

  <!-- Celebrity path -->
  <rect x="420" y="170" width="280" height="130" rx="8" fill="#200505" stroke="#f85149" stroke-width="2"/>
  <text x="560" y="193" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">Celebrity (&gt;10K followers)</text>
  <text x="560" y="211" text-anchor="middle" fill="#ff9090" font-size="10">NO fanout on write!</text>
  <rect x="435" y="220" width="250" height="35" rx="5" fill="#200505" stroke="#f85149" stroke-width="1"/>
  <text x="560" y="242" text-anchor="middle" fill="#ff9090" font-size="10">Tweet stored in celebrity table only</text>
  <text x="560" y="255" text-anchor="middle" fill="#ff9090" font-size="10">(no Redis writes per follower)</text>
  <rect x="435" y="263" width="250" height="30" rx="5" fill="#200505" stroke="#f85149" stroke-width="1"/>
  <text x="560" y="283" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">@taylorswift13: 100M follows = disaster</text>

  <!-- Timeline read (merge) -->
  <rect x="240" y="340" width="480" height="100" rx="8" fill="#0a1628" stroke="#1da1f2" stroke-width="2"/>
  <text x="480" y="363" text-anchor="middle" fill="#1da1f2" font-size="13" font-weight="bold">Timeline Read (Hybrid Merge)</text>
  <text x="260" y="386" fill="#7ab8ff" font-size="11">1. ZREVRANGE timeline:{user_id} 0 19</text>
  <text x="260" y="404" fill="#7ab8ff" font-size="11">   → Redis (pre-computed timeline, &lt;1ms)</text>
  <text x="260" y="422" fill="#7ab8ff" font-size="11">2. For each followed celebrity: fetch last tweets</text>
  <text x="260" y="437" fill="#7ab8ff" font-size="11">   → Merge + rank → return to user</text>

  <!-- Arrow lines for routing -->
  <line x1="280" y1="130" x2="200" y2="170" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrG)"/>
  <text x="235" y="155" fill="#3fb950" font-size="10" text-anchor="middle">&lt;10K</text>
  <line x1="410" y1="130" x2="510" y2="170" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
  <text x="475" y="155" fill="#f85149" font-size="10" text-anchor="middle">&gt;10K</text>

  <!-- Redis timeline store -->
  <rect x="730" y="170" width="230" height="130" rx="8" fill="#0a1628" stroke="#1da1f2" stroke-width="2"/>
  <text x="845" y="193" text-anchor="middle" fill="#1da1f2" font-size="12" font-weight="bold">Redis Timeline Store</text>
  <text x="845" y="211" text-anchor="middle" fill="#7ab8ff" font-size="10">Sorted Set per user</text>
  <rect x="745" y="220" width="200" height="30" rx="4" fill="#0d1a40" stroke="#1da1f2" stroke-width="1"/>
  <text x="845" y="240" text-anchor="middle" fill="#1da1f2" font-size="10">Key: timeline:{user_id}</text>
  <rect x="745" y="257" width="200" height="30" rx="4" fill="#0d1a40" stroke="#1da1f2" stroke-width="1"/>
  <text x="845" y="277" text-anchor="middle" fill="#1da1f2" font-size="10">Score: timestamp</text>
  <rect x="745" y="293" width="200" height="30" rx="4" fill="#0d1a40" stroke="#1da1f2" stroke-width="1"/>
  <text x="845" y="305" text-anchor="middle" fill="#1da1f2" font-size="10">Value: tweet_id (max 800)</text>

  <line x1="380" y1="235" x2="730" y2="235" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrG)"/>

  <!-- Manhattan + Finagle -->
  <rect x="30" y="470" width="440" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="250" y="492" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="bold">Manhattan + Finagle</text>
  <text x="50" y="514" fill="#cccccc" font-size="11">Manhattan: Twitter's custom KV store (tweets, user data) — LevelDB + consistent hashing</text>
  <text x="50" y="532" fill="#cccccc" font-size="11">Finagle: RPC framework (Scala) — circuit breaking + retry + timeout built-in</text>
  <text x="50" y="550" fill="#3fb950" font-size="11">Replaced Ruby on Rails monolith (GIL-limited) → True JVM concurrency</text>

  <!-- Clean arch + lessons -->
  <rect x="490" y="470" width="470" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="725" y="492" text-anchor="middle" fill="#e3b341" font-size="12" font-weight="bold">Clean Architecture Mapping</text>
  <text x="510" y="514" fill="#cccccc" font-size="11">TimelineService = Use Case · Redis = ITimelineRepository adapter</text>
  <text x="510" y="532" fill="#cccccc" font-size="11">FanoutService = Use Case with side effects · IFanoutPort → Redis adapter</text>
  <text x="510" y="550" fill="#3fb950" font-size="11">Strategy: fanout implementation chosen by follower count (strategy pattern)</text>

  <text x="40" y="594" fill="#3fb950" font-size="11">✓ Hybrid fanout solved the celebrity problem  ✓ Redis timeline: one read vs MySQL join  ✓ Pre-computed beats real-time at scale</text>
  <text x="40" y="612" fill="#f85149" font-size="11">✗ Merge step on timeline read adds latency  ✗ Celebrity threshold (10K) is arbitrary  ✗ Elon Musk's 150M followers broke this in 2023</text>
</svg>
