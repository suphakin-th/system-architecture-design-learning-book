<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0d1117"/><stop offset="100%" style="stop-color:#161b22"/></linearGradient>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3fb950"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#388bfd"/></marker>
    <marker id="arrY" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#e3b341"/></marker>
  </defs>
  <rect width="960" height="640" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="bold">Service Mesh Architecture</text>
  <text x="480" y="57" text-anchor="middle" fill="#8b949e" font-size="13">Sidecar proxies handle mTLS · Retries · Circuit Breaking · Observability — services know nothing</text>

  <!-- Control Plane (top) -->
  <rect x="300" y="75" width="360" height="55" rx="8" fill="#200515" stroke="#bc8cff" stroke-width="2.5"/>
  <text x="480" y="97" text-anchor="middle" fill="#bc8cff" font-size="14" font-weight="bold">Control Plane — Istio / Linkerd</text>
  <text x="480" y="118" text-anchor="middle" fill="#d2a8ff" font-size="11">Pushes config to all sidecars · Manages certificates · Enforces policies</text>

  <!-- Service Pods (as groups) -->
  <!-- Order Service Pod -->
  <rect x="40" y="190" width="270" height="190" rx="10" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="175" y="213" text-anchor="middle" fill="#388bfd" font-size="12" font-weight="bold">Kubernetes Pod</text>
  <rect x="55" y="222" width="240" height="75" rx="6" fill="#0a2010" stroke="#3fb950" stroke-width="1.5"/>
  <text x="175" y="244" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">Order Service</text>
  <text x="175" y="262" text-anchor="middle" fill="#85e89d" font-size="10">PlaceOrderUseCase</text>
  <text x="175" y="278" text-anchor="middle" fill="#85e89d" font-size="10">HttpPaymentGateway (adapter)</text>
  <text x="175" y="294" text-anchor="middle" fill="#6e7681" font-size="10">calls: http://payment-svc/charge</text>
  <rect x="55" y="304" width="240" height="65" rx="6" fill="#1a0a28" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="175" y="325" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">Envoy Sidecar</text>
  <text x="175" y="343" text-anchor="middle" fill="#d2a8ff" font-size="10">mTLS · Retry · Circuit Break</text>
  <text x="175" y="359" text-anchor="middle" fill="#d2a8ff" font-size="10">Metrics · Tracing · Load Balance</text>

  <!-- Payment Service Pod -->
  <rect x="350" y="190" width="270" height="190" rx="10" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="485" y="213" text-anchor="middle" fill="#388bfd" font-size="12" font-weight="bold">Kubernetes Pod</text>
  <rect x="365" y="222" width="240" height="75" rx="6" fill="#201500" stroke="#d29922" stroke-width="1.5"/>
  <text x="485" y="244" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">Payment Service</text>
  <text x="485" y="262" text-anchor="middle" fill="#f0c060" font-size="10">ChargePaymentUseCase</text>
  <text x="485" y="278" text-anchor="middle" fill="#f0c060" font-size="10">StripeGateway (adapter)</text>
  <text x="485" y="294" text-anchor="middle" fill="#6e7681" font-size="10">uses: Stripe SDK</text>
  <rect x="365" y="304" width="240" height="65" rx="6" fill="#1a0a28" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="485" y="325" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">Envoy Sidecar</text>
  <text x="485" y="343" text-anchor="middle" fill="#d2a8ff" font-size="10">mTLS · Retry · Circuit Break</text>
  <text x="485" y="359" text-anchor="middle" fill="#d2a8ff" font-size="10">Metrics · Tracing · Load Balance</text>

  <!-- User Service Pod -->
  <rect x="660" y="190" width="270" height="190" rx="10" fill="#0a1628" stroke="#388bfd" stroke-width="2"/>
  <text x="795" y="213" text-anchor="middle" fill="#388bfd" font-size="12" font-weight="bold">Kubernetes Pod</text>
  <rect x="675" y="222" width="240" height="75" rx="6" fill="#0a1628" stroke="#388bfd" stroke-width="1.5"/>
  <text x="795" y="244" text-anchor="middle" fill="#388bfd" font-size="12" font-weight="bold">User Service</text>
  <text x="795" y="262" text-anchor="middle" fill="#7ab8ff" font-size="10">GetUserUseCase</text>
  <text x="795" y="278" text-anchor="middle" fill="#7ab8ff" font-size="10">UserRepositoryPostgres</text>
  <text x="795" y="294" text-anchor="middle" fill="#6e7681" font-size="10">queries: PostgreSQL</text>
  <rect x="675" y="304" width="240" height="65" rx="6" fill="#1a0a28" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="795" y="325" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">Envoy Sidecar</text>
  <text x="795" y="343" text-anchor="middle" fill="#d2a8ff" font-size="10">mTLS · Retry · Circuit Break</text>
  <text x="795" y="359" text-anchor="middle" fill="#d2a8ff" font-size="10">Metrics · Tracing · Load Balance</text>

  <!-- Control plane to sidecars -->
  <line x1="415" y1="130" x2="175" y2="304" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrY)"/>
  <line x1="480" y1="130" x2="485" y2="304" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrY)"/>
  <line x1="545" y1="130" x2="795" y2="304" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrY)"/>
  <text x="260" y="215" fill="#bc8cff" font-size="10">config push</text>

  <!-- Traffic between pods (via sidecars) -->
  <line x1="295" y1="340" x2="350" y2="340" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="322" y="330" fill="#3fb950" font-size="10" text-anchor="middle">mTLS</text>
  <line x1="620" y1="340" x2="660" y2="340" stroke="#388bfd" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="640" y="330" fill="#388bfd" font-size="10" text-anchor="middle">mTLS</text>

  <!-- Observability stack -->
  <rect x="200" y="432" width="560" height="75" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="480" y="455" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">Observability (all powered by sidecar telemetry)</text>
  <text x="270" y="478" text-anchor="middle" fill="#c9d1d9" font-size="11">Prometheus</text>
  <text x="270" y="494" text-anchor="middle" fill="#8b949e" font-size="10">Metrics</text>
  <text x="480" y="478" text-anchor="middle" fill="#c9d1d9" font-size="11">Jaeger/Zipkin</text>
  <text x="480" y="494" text-anchor="middle" fill="#8b949e" font-size="10">Distributed Tracing</text>
  <text x="690" y="478" text-anchor="middle" fill="#c9d1d9" font-size="11">Kiali</text>
  <text x="690" y="494" text-anchor="middle" fill="#8b949e" font-size="10">Service Graph</text>

  <!-- Big tech -->
  <text x="40" y="545" fill="#8b949e" font-size="12" font-weight="bold">Big Tech:</text>
  <text x="120" y="545" fill="#3fb950" font-size="12">Lyft (invented Envoy)</text>
  <text x="305" y="545" fill="#388bfd" font-size="12">Google (Istio)</text>
  <text x="445" y="545" fill="#bc8cff" font-size="12">Uber (4000+ svcs)</text>
  <text x="610" y="545" fill="#e3b341" font-size="12">Pinterest (mTLS)</text>
  <text x="770" y="545" fill="#d29922" font-size="12">Airbnb (Aperture)</text>

  <text x="40" y="573" fill="#3fb950" font-size="11">✓ Zero-code resilience  ✓ Auto mTLS  ✓ Full observability  ✓ Canary deployments  ✓ Language-agnostic</text>
  <text x="40" y="593" fill="#f85149" font-size="11">✗ High complexity  ✗ +100MB RAM per sidecar  ✗ +1-2ms latency  ✗ Needs Kubernetes  ✗ Requires platform team</text>
  <text x="40" y="613" fill="#8b949e" font-size="10">Services (and Clean Architecture within them) remain 100% unaware of the mesh — perfect separation of concerns</text>
</svg>
